<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>沙盘动物图鉴</title>
<style>
:root{
  --paper:#F6F1E8; --paper-2:#ECE5D8; --ink:#2A2621; --ink-2:#645B50; --ink-3:#9C9285; --rule:rgba(42,38,33,.12);
  --ochre:#B0653A; --ochre-soft:#F1E1D2;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --sh:0 1px 2px rgba(40,30,20,.06), 0 10px 30px rgba(40,30,20,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#E6DFD2;color:var(--ink);font-family:var(--sans);font-size:16px;}
#stage{position:fixed;inset:0;} #stage canvas{display:block;touch-action:none;width:100% !important;height:100% !important;}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;}
.panel{background:var(--paper);border-radius:14px;box-shadow:var(--sh);}

/* ---------- 顶栏 ---------- */
#title{position:fixed;left:28px;top:24px;z-index:5;pointer-events:none;font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.14em;transition:opacity .4s;}
body.dark #title{color:#EFE7D8;}
body:not(.overview) #title{opacity:0;}
#nav{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:5px;}
#nav button{height:40px;padding:0 16px;border-radius:10px;font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1em;color:var(--ink-2);display:flex;align-items:center;gap:8px;transition:background .2s,color .2s;white-space:nowrap;}
#nav button i{font-style:normal;font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:0;color:var(--ink-3);font-variant-numeric:tabular-nums;}
#nav button:hover{background:var(--paper-2);color:var(--ink);}
#nav button.on{background:var(--ink);color:var(--paper);} #nav button.on i{color:rgba(246,241,232,.55);}
#right{position:fixed;right:22px;top:20px;z-index:6;display:flex;gap:10px;}
#right > button{height:50px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;}
#right svg{width:20px;height:20px;flex:none;}
#clock .moon{display:none;} #clock.night .sun{display:none;} #clock.night .moon{display:block;}
#clock b{font-family:var(--serif);font-size:16px;letter-spacing:.1em;}
#nbBtn b{font-family:var(--serif);font-size:16px;letter-spacing:.1em;}
#nbCount{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;border-left:1px solid var(--rule);padding-left:10px;}
#nbBtn.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1);} @keyframes bump{40%{transform:scale(1.08)}}
#snd{width:50px;justify-content:center;padding:0 !important;} #snd.off{opacity:.45;}

/* ---------- 一句提示 ---------- */
#hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:5;font-size:16px;letter-spacing:.06em;color:var(--ink);
  background:rgba(246,241,232,.9);padding:11px 22px;border-radius:99px;box-shadow:var(--sh);pointer-events:none;white-space:nowrap;transition:opacity .4s,transform .4s;}
#hint.gone{opacity:0;transform:translate(-50%,10px);}
body.dark #hint{background:rgba(32,34,46,.85);color:#E9E1D2;}

/* ---------- 名字牌 ---------- */
#tag{position:fixed;left:0;top:0;z-index:4;pointer-events:none;font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.08em;
  background:var(--paper);padding:6px 12px;border-radius:8px;box-shadow:var(--sh);opacity:0;transition:opacity .15s;white-space:nowrap;}
#tag.on{opacity:1;}

/* ---------- 动物卡片 ---------- */
#card{position:fixed;left:24px;bottom:24px;z-index:7;width:380px;padding:20px 20px 16px;transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.3,.9,.3,1);}
#card.on{opacity:1;transform:none;pointer-events:auto;}
#cClose{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--ink-3);}
#cClose:hover{background:var(--paper-2);color:var(--ink);}
#cPic{display:block;width:100%;height:150px;margin:0 0 8px;border-radius:10px;background:radial-gradient(ellipse at 50% 70%, #FBF7F0 0%, #EFE6D8 75%);}
#cName{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.08em;}
#cDots{display:flex;gap:6px;margin-top:10px;align-items:center;}
#cDots span{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ochre);}
#cDots span.ok{background:var(--ochre);}
#cDots em{font-style:normal;font-size:13px;color:var(--ink-3);margin-left:6px;}
#cAct{font-size:17px;line-height:1.5;margin-top:12px;min-height:26px;color:var(--ink);}
#cAct.say{color:var(--ochre);}
#cActs{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:6px;margin-top:16px;}
#cActs button{height:62px;border-radius:12px;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--ink);transition:background .15s,transform .1s;}
#cActs button:hover{background:#E2D8C7;} #cActs button:active{transform:scale(.96);}
#cActs button svg{width:22px;height:22px;}
#cActs button.poke{background:var(--ink);color:var(--paper);} #cActs button.poke:hover{background:#403A33;}
#cHint{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:14.5px;color:var(--ink-2);line-height:1.5;}
#cHint b{color:var(--ochre);font-weight:600;}

/* ---------- 新发现 ---------- */
#found{position:fixed;left:50%;top:92px;z-index:8;width:min(440px,calc(100vw - 32px));transform:translate(-50%,-14px);opacity:0;pointer-events:none;
  padding:18px 22px 18px;border-left:5px solid var(--ochre);transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.5,1);}
#found.on{opacity:1;transform:translate(-50%,0);}
#found small{display:block;font-size:13px;letter-spacing:.2em;color:var(--ochre);font-weight:600;}
#found b{display:block;font-family:var(--serif);font-size:22px;letter-spacing:.06em;margin-top:6px;}
#found p{margin:6px 0 0;font-size:16px;line-height:1.6;color:var(--ink-2);}

/* ---------- 手记 ---------- */
#notebook{position:fixed;top:0;right:0;bottom:0;z-index:9;width:min(460px,100vw);background:var(--paper);box-shadow:-10px 0 40px rgba(40,30,20,.2);
  transform:translateX(105%);transition:transform .45s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;}
#notebook.open{transform:none;}
.nb-h{padding:28px 28px 18px;border-bottom:1px solid var(--rule);}
.nb-h h2{margin:0;font-family:var(--serif);font-size:26px;letter-spacing:.14em;}
.nb-h p{margin:8px 0 0;font-size:15px;color:var(--ink-2);}
#nbClose{position:absolute;right:16px;top:20px;width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--ink-2);}
#nbClose:hover{background:var(--paper-2);}
#nbBody{flex:1;overflow:auto;padding:4px 28px 40px;}
#nbBody h3{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink);font-family:var(--serif);font-size:18px;letter-spacing:.2em;}
#nbBody h3 span{font-family:var(--sans);font-size:14px;letter-spacing:0;color:var(--ink-2);font-weight:400;}
.sp{border-bottom:1px solid var(--rule);}
.sp > button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 0;text-align:left;}
.sp > button b{font-family:var(--serif);font-size:18px;letter-spacing:.06em;flex:1;}
.sp.blank > button b{color:var(--ink-3);}
.sp .dots{display:flex;gap:5px;} .sp .dots span{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ochre);} .sp .dots span.ok{background:var(--ochre);}
.sp .arr{color:var(--ink-3);transition:transform .2s;} .sp.open .arr{transform:rotate(90deg);}
.sp .body{display:none;padding:0 0 18px;}
.sp.open .body{display:block;}
.ob{display:flex;gap:12px;padding:8px 0;}
.ob i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ochre);color:#fff;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.ob.no i{background:none;border:1.5px dashed var(--ink-3);color:var(--ink-3);}
.ob b{display:block;font-size:16px;} .ob span{display:block;font-size:15px;line-height:1.6;color:var(--ink-2);margin-top:2px;}
.ob.no b{font-weight:400;color:var(--ink-3);}
.file{margin-top:10px;background:var(--ochre-soft);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.75;color:var(--ink);}
.file b{display:block;font-family:var(--serif);font-size:15px;letter-spacing:.1em;color:var(--ochre);margin-bottom:4px;}
.locked{margin-top:10px;font-size:14px;color:var(--ink-3);}

/* ---------- 开场 ---------- */
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:28px;
  background:rgba(236,230,219,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .6s,visibility .6s;}
#intro.gone{opacity:0;visibility:hidden;}
.in{text-align:center;max-width:520px;}
.in small{font-size:14px;letter-spacing:.4em;color:var(--ink-3);}
.in h2{margin:14px 0 18px;font-family:var(--serif);font-size:60px;letter-spacing:.2em;font-weight:700;}
.in p{font-size:19px;line-height:1.8;color:var(--ink-2);margin:0 0 34px;}
#enter{background:var(--ink);color:var(--paper);height:56px;padding:0 44px;border-radius:14px;font-size:18px;letter-spacing:.2em;transition:opacity .3s;}
#enter:disabled{opacity:.55;font-size:15px;letter-spacing:.08em;cursor:default;}

@media (max-width:760px){
  html,body{font-size:15px;}
  #title{display:none;}
  #nav{top:74px;left:12px;right:12px;transform:none;justify-content:space-between;}
  #nav button{flex:1;justify-content:center;padding:0 4px;font-size:15px;} #nav button i{display:none;}
  #right{left:12px;right:12px;top:12px;}
  #right > button{height:50px;padding:0 14px;}
  #clock{flex:1;justify-content:center;}
  #nbBtn b{display:none;} #nbCount{border:0;padding:0;font-size:14px;}
  #found{top:136px;}
  #card{left:10px;right:10px;bottom:10px;width:auto;padding:18px 16px 14px;}
  #cActs button{height:54px;font-size:13px;}
  #cPic{height:104px;} #cName{font-size:20px;} #cAct{font-size:15.5px;margin-top:8px;} #cActs{margin-top:10px;} #cHint{margin-top:10px;padding-top:9px;font-size:13.5px;}
  #hint{bottom:22px;font-size:15px;}
  .in h2{font-size:46px;} .in p{font-size:17px;}
}
</style>
</head>

<div id="stage"></div>

<div id="title">沙盘动物图鉴</div>
<nav id="nav" class="panel"></nav>
<div id="right">
  <button id="clock" class="panel" title="切换昼夜">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 14.5A7.5 7.5 0 019.5 5a7.5 7.5 0 109.5 9.5z"/></svg>

  <button id="snd" class="panel" title="声音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M15.5 9.5a3.5 3.5 0 010 5M17.8 7.2a6.7 6.7 0 010 9.6"/></svg></button>
</div>

<div id="hint">点一块景观，走近看看</div>

<div id="card" class="panel">
  <button id="cClose" aria-label="关闭">✕</button>
  <canvas id="cPic"></canvas>
  <div id="cName"></div>
  <div id="cDots"></div>
  <div id="cAct"></div>

    <button class="poke" data-a="poke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11V5.5a1.5 1.5 0 013 0V11m0-1.5a1.5 1.5 0 013 0V11m0-.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-.5a6 6 0 01-5-2.7L4 14.5a1.5 1.5 0 012.4-1.8L9 15"/></svg>碰一碰</button>
    <button data-a="leaf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 19C5 10 11 5 20 4.5 19.5 13.5 14 19 5 19z"/><path d="M5 19l8-8"/></svg>菜叶</button>
    <button data-a="seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="8" cy="9" rx="2.2" ry="3.2" transform="rotate(-25 8 9)"/><ellipse cx="15.5" cy="8" rx="2.2" ry="3.2" transform="rotate(20 15.5 8)"/><ellipse cx="11.5" cy="16" rx="2.2" ry="3.2" transform="rotate(-5 11.5 16)"/></svg>种子</button>
    <button data-a="bug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="13.5" rx="4" ry="5.5"/><path d="M12 8V6M9.5 5.5L8 4M14.5 5.5L16 4M8 11H4.5M8 15H4.5M16 11h3.5M16 15h3.5M12 8v11"/></svg>虫子</button>
    <button data-a="meat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 14c-2-4 1-9 6-9s8 3 7 7-5 6-8 6-4-1-5-4z"/><path d="M10 11c1-1 3-1 4 0"/></svg>肉粒</button>
  </div>
  <div id="cHint"></div>
</div>

<div id="found" class="panel"><small>新发现</small><b id="fH"></b><p id="fT"></p></div>

<aside id="notebook">
  <div class="nb-h"><h2>观察手记</h2><p>记录关于小动物们的知识点。</p><button id="nbClose">✕</button></div>
  <div id="nbBody"></div>
</aside>

<div id="intro"><div class="in">

  <h2>沙盘动物图鉴</h2>
  <p>动物在场景中自由活动<br/>点击，拖拽，喂食，请自由和他们互动吧！</p>
  <button id="enter">开始</button>
</div></div>

  const g = new THREE.SphereGeometry(1, o.w||30, o.h||22);
  if (o.shape){ const p = g.attributes.position, v = new V3();
    for (let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); o.shape(v); p.setXYZ(i,v.x,v.y,v.z); } }
  let m;
  if (typeof col === 'function'){ vcolor(g, col); m = o.fur === false ? VCM : VCF; }
  else m = M(col, o.mat||{});
  g.scale(rx, ry, rz); g.computeVertexNormals();
  const out = mesh(g, m);
  if (m === VCF && typeof TEX !== 'undefined' && !o.noFur) out.add(furShell(g, clamp(Math.min(rx,ry,rz)*.14, .005, .022)));
  return out;
}
function eye(r, x, y, z, iris, px=1){
  const g = new THREE.Group();
  if (iris){
    g.add(mesh(new THREE.SphereGeometry(r, 16, 12), M(iris, { roughness:.2 })));
    const p = mesh(new THREE.SphereGeometry(r*.62, 12, 10), M('#0E0B09', { roughness:.1 })); p.position.z = r*.45; p.scale.set(px,1,1); g.add(p);
  } else g.add(mesh(new THREE.SphereGeometry(r, 16, 12), M('#120E0B', { roughness:.12 })));
  const hl = new THREE.Mesh(new THREE.SphereGeometry(r*.26, 8, 6), new THREE.MeshBasicMaterial({ color:'#ffffff' }));
  hl.position.set(r*.38, r*.42, r*.72); g.add(hl);

}

/* ---------- 接触阴影：让东西「站」在地上 ---------- */
const CONTACT = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(20,16,10,.55)'); g.addColorStop(.5,'rgba(20,16,10,.22)'); g.addColorStop(1,'rgba(20,16,10,0)');

/* ---------- 皮毛：同一块体往外套几层「壳」，每层只留一部分像素，看起来就是一根根毛 ---------- */
const FUR_N = LOW ? 4 : 7;
const FUR_MAT = (()=>{ const m = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.9, envMapIntensity:ENV_I });
  m.onBeforeCompile = sh=>{
    sh.uniforms.furMap = { value:TEX.fur };
    sh.vertexShader = 'attribute float aShell;\nvarying float vShell;\nvarying vec2 vFurUv;\n' + sh.vertexShader.replace('#include <uv_vertex>', '#include <uv_vertex>\n vShell = aShell; vFurUv = uv;');
    sh.fragmentShader = 'uniform sampler2D furMap;\nvarying float vShell;\nvarying vec2 vFurUv;\n' + sh.fragmentShader
      .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
        float hair = texture2D(furMap, vFurUv*vec2(96.,48.)).r;
        if (hair < vShell*.92 + .06) discard;`)
      .replace('#include <color_fragment>', '#include <color_fragment>\n diffuseColor.rgb *= .72 + .42*vShell;');
  };
  return m; })();
function furShell(g, len){
  const P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv, C = g.attributes.color, I = g.index, n = P.count;
  const pos = new Float32Array(n*FUR_N*3), nor = new Float32Array(n*FUR_N*3), uv = new Float32Array(n*FUR_N*2), col = new Float32Array(n*FUR_N*3), sh = new Float32Array(n*FUR_N), idx = [];
  for (let s=0;s<FUR_N;s++){ const k = (s+1)/FUR_N, off = len*k;
    for (let i=0;i<n;i++){ const j = s*n+i;
      pos[j*3] = P.getX(i) + N.getX(i)*off; pos[j*3+1] = P.getY(i) + N.getY(i)*off - off*off*6; pos[j*3+2] = P.getZ(i) + N.getZ(i)*off;
      nor[j*3] = N.getX(i); nor[j*3+1] = N.getY(i); nor[j*3+2] = N.getZ(i); uv[j*2] = U.getX(i); uv[j*2+1] = U.getY(i);
      col[j*3] = C.getX(i); col[j*3+1] = C.getY(i); col[j*3+2] = C.getZ(i); sh[j] = k; }
    for (let q=0;q<I.count;q++) idx.push(I.getX(q) + s*n); }

  fg.setAttribute('position', new THREE.BufferAttribute(pos,3)); fg.setAttribute('normal', new THREE.BufferAttribute(nor,3));

    fg.setAttribute('skinIndex', new THREE.BufferAttribute(si,4)); fg.setAttribute('skinWeight', new THREE.BufferAttribute(sw,4)); }

/* ---------- 自适应：任何时候窗口变化都立刻跟上（包括页面还在搭建动物的时候） ---------- */
let _rw = 0, _rh = 0;

  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  if (w === _rw && h === _rh) return; _rw = w; _rh = h;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); composer.setSize(w, h); setTilt();

/* ============================================================
   程序化贴图：地表、树皮、石头、木纹、皮毛
   全部在浏览器里用画布算出来，可平铺，并配一张法线贴图做细小起伏
   ============================================================ */
const TEX = (()=>{
  /* 可平铺的值噪声：格点按周期取模 */
  function tnoise(P, seed){
    const H = (i,j)=>{ i = ((i%P)+P)%P; j = ((j%P)+P)%P; const s = Math.sin(i*127.1 + j*311.7 + seed*74.7)*43758.5453; return s - Math.floor(s); };

      return lerp(lerp(H(xi,yi), H(xi+1,yi), u), lerp(H(xi,yi+1), H(xi+1,yi+1), u), v); };

  function tfbm(size, oct, seed){
    const ns = []; for (let o=0;o<oct;o++) ns.push([tnoise(4<<o, seed+o*13), 4<<o]);
    return (px,py)=>{ let s = 0, a = .5, t = 0; ns.forEach(([n,P])=>{ s += n(px/size*P, py/size*P)*a; t += a; a *= .5; }); return s/t; };

  function normalFrom(h, S, k){
    const c = canvas(S), x = c.getContext('2d'), im = x.createImageData(S,S);
    for (let j=0;j<S;j++) for (let i=0;i<S;i++){
      const l = h[j*S + (i-1+S)%S], r = h[j*S + (i+1)%S], u = h[((j-1+S)%S)*S + i], d = h[((j+1)%S)*S + i];
      let nx = (l-r)*k, ny = (u-d)*k, nz = 1; const L = Math.hypot(nx,ny,nz); nx /= L; ny /= L; nz /= L;
      const p = (j*S+i)*4; im.data[p] = (nx*.5+.5)*255; im.data[p+1] = (ny*.5+.5)*255; im.data[p+2] = (nz*.5+.5)*255; im.data[p+3] = 255; }
    x.putImageData(im,0,0); return c;
  }
  function tex(c, rep=1){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep,rep); t.anisotropy = 4; return t; }

  function make(S, fn, nk){

    for (let j=0;j<S;j++) for (let i=0;i<S;i++){ const [v, hh, r, g, b] = fn(i,j); h[j*S+i] = hh; const p = (j*S+i)*4;
      im.data[p] = (r ?? v)*255; im.data[p+1] = (g ?? v)*255; im.data[p+2] = (b ?? v)*255; im.data[p+3] = 255; }

  }

  /* 草地：细碎的草纤维 + 斑驳 + 零星小石子 */
  const lawn = (()=>{
    const f = tfbm(S, 5, 1), g = tfbm(S, 3, 7), c = canvas(S), x = c.getContext('2d');
    const base = make(S, (i,j)=>{ const n = f(i,j), m = g(i,j); const v = .7 + n*.24 + (m-.5)*.12; return [v, n*.8]; }, 3);
    x.drawImage(base.canvas, 0, 0);
    for (let k=0;k<S*9;k++){ const px = Math.random()*S, py = Math.random()*S, a = rand(-.6,.6) - Math.PI/2, L = rand(6,16)*S/512;
      const v = Math.random() < .5 ? rand(.45,.65) : rand(.9,1); x.strokeStyle = `rgba(${v*255|0},${v*255|0},${v*230|0},${rand(.35,.7)})`; x.lineWidth = rand(1,2.2)*S/512;
      x.beginPath(); x.moveTo(px,py); x.lineTo(px + Math.cos(a)*L, py + Math.sin(a)*L); x.stroke(); }
    for (let k=0;k<S/6;k++){ const px = Math.random()*S, py = Math.random()*S, r = rand(1.2,3)*S/512;
      x.fillStyle = 'rgba(245,238,225,.55)'; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); }
    return { map:tex(c), normal:base.normal };
  })();
  /* 沙土：颗粒 + 碎石 */
  const soil = (()=>{
    const f = tfbm(S, 5, 3), c = canvas(S), x = c.getContext('2d');
    const base = make(S, (i,j)=>{ const n = f(i,j), gr = Math.random(); const v = .82 + n*.12 + (gr-.5)*.07; return [v, n*.5 + gr*.12]; }, 2.6);
    x.drawImage(base.canvas, 0, 0);
    for (let k=0;k<S*1.2;k++){ const px = Math.random()*S, py = Math.random()*S, r = rand(.8,3.2)*S/512, v = rand(.72,1.05);
      x.fillStyle = `rgba(${v*250|0},${v*238|0},${v*220|0},.7)`; x.beginPath(); x.ellipse(px,py,r,r*rand(.6,1),rand(0,3),0,7); x.fill();
      x.strokeStyle = 'rgba(60,45,30,.25)'; x.lineWidth = .6; x.stroke(); }
    return { map:tex(c), normal:base.normal };
  })();
  /* 树皮：竖向深沟 */
  const bark = make(LOW ? 128 : 256, (()=>{ const n = tfbm(256, 4, 11), m = tnoise(8, 5);
    return (i,j)=>{ const s = LOW ? 2 : 1, u = i*s, v = j*s; const gro = Math.abs(Math.sin((u/256*14 + m(u/32, v/96)*2.2)*Math.PI));
      const h = Math.pow(gro, .6)*.8 + n(u, v*.35)*.3; const val = .55 + h*.45; return [val, h, val*1.02, val*.95, val*.88]; }; })(), 4);
  /* 石头：斑块 + 细裂纹 */
  const stone = make(LOW ? 128 : 256, (()=>{ const n = tfbm(256, 5, 21), c = tnoise(16, 9);
    return (i,j)=>{ const s = LOW ? 2 : 1, u = i*s, v = j*s, a = n(u,v), cr = Math.abs(c(u/16, v/16) - .5) < .025 ? -.35 : 0;
      const val = .75 + a*.25 + cr*.5; return [val, a + cr]; }; })(), 3);
  /* 木纹 */
  const wood = make(LOW ? 128 : 256, (()=>{ const n = tfbm(256, 4, 31);
    return (i,j)=>{ const s = LOW ? 2 : 1, u = i*s, v = j*s, w = Math.sin((v/256*26 + n(u*.25, v)*3)*Math.PI); const val = .78 + w*.1 + n(u,v)*.12; return [val, w*.4 + .5]; }; })(), 2);
  /* 皮毛：每个像素一根毛的「高度」 */
  const fur = (()=>{ const F = 128, c = canvas(F), x = c.getContext('2d'), im = x.createImageData(F,F);
    for (let p=0;p<F*F;p++){ const v = Math.random(); im.data[p*4] = im.data[p*4+1] = im.data[p*4+2] = v*255; im.data[p*4+3] = 255; }
    x.putImageData(im,0,0); const t = tex(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; return t; })();
  /* 水面细波 */
  const ripple = make(LOW ? 128 : 256, (()=>{ const n = tfbm(256, 4, 41); return (i,j)=>{ const s = LOW ? 2 : 1, a = n(i*s, j*s); return [1, a]; }; })(), 3);
  return { lawn, soil, bark, stone, wood, fur, ripple };
})();

const GRASS_U = { value:0 };
/* 三种草丛：矮的、中的、高的；每丛十几到二十几片弯叶 */
function clumpGeo(n, hMin, hMax, spread, lean0, lean1, wMax){
  const pos = [], col = [], nor = [], idx = []; let vi = 0;
  for (let b=0;b<n;b++){
    const a = b/n*6.283 + rand(-.3,.3), r0 = Math.sqrt(Math.random())*spread, h = rand(hMin,hMax), lean = rand(lean0,lean1)*(.6 + r0/spread*.6), w = rand(wMax*.6, wMax);
    const dx = Math.cos(a), dz = Math.sin(a), px = -dz, pz = dx, ox = dx*r0, oz = dz*r0, S = 6, tw = rand(-.3,.3);
    for (let s=0;s<=S;s++){ const t = s/S, ww = w*Math.pow(1-t, .85), bend = lean*t*t*h;
      const cx = ox + dx*bend + px*tw*t*t*h*.3, cz = oz + dz*bend + pz*tw*t*t*h*.3, cy = h*t*(1 - lean*.35*t);
      pos.push(cx-px*ww, cy, cz-pz*ww, cx+px*ww, cy, cz+pz*ww);
      const g = .72 + .45*t, warm = t*t*.1; col.push(g+warm, g+warm*.6, g*.9, g+warm, g+warm*.6, g*.9);
      nor.push(dx*.5,1,dz*.5, dx*.5,1,dz*.5); }
    for (let s=0;s<S;s++){ const q = vi + s*2; idx.push(q,q+1,q+2, q+1,q+3,q+2); }
    vi += (S+1)*2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3)); g.setIndex(idx); g.normalizeNormals();
  return g;
}
const CLUMPS = [ clumpGeo(26, .14, .26, .1, .35, .9, .042), clumpGeo(32, .22, .42, .12, .3, .8, .046), clumpGeo(40, .36, .72, .15, .2, .65, .042) ];
const GRASS_MAT = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.85, side:THREE.DoubleSide, envMapIntensity:.3 });
GRASS_MAT.onBeforeCompile = sh=>{

};
/* 有圆角的盒子：房子、台阶、窗框都用它，边缘能接住光 */
function rbox(w, h, d, r, col, o){
  r = Math.min(r, w/2-.001, h/2-.001, d/2-.001);
  const s = new THREE.Shape(), x = w/2-r, y = h/2-r;
  s.moveTo(-x,-y); s.lineTo(x,-y); s.lineTo(x,y); s.lineTo(-x,y); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:Math.max(.0001, d-2*r), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:4 });
  g.translate(0, 0, -(d-2*r)/2); g.computeVertexNormals();
  return mesh(g, typeof col === 'string' ? M(col, o||{}) : col);
}
/* 一团有起伏的叶冠：一个整体，表面有成簇的鼓包和缝隙 */
function foliage(r, seed, cols, flat=.78){
  const g = new THREE.SphereGeometry(1, 64, 44), p = g.attributes.position, v = new V3(), nz = [];
  for (let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i);
    const n = fbm3(v.x*1.5+seed, v.y*1.5+seed*.3, v.z*1.5+seed*.7), fine = vn3(v.x*7+seed, v.y*7, v.z*7);
    const k = 1 + (n-.5)*.62 + (fine-.5)*.07; nz.push(n);
    v.multiplyScalar(k); if (v.y < 0) v.y *= flat; p.setXYZ(i, v.x, v.y, v.z); }
  const c = new Float32Array(p.count*3);
  for (let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const up = sstep(-.9,1,v.y), cav = sstep(.3,.62,nz[i]);
    tc.set(cols[0]).lerp(new C3(cols[1]), up*.8 + cav*.35).lerp(new C3(cols[2]), sstep(.55,1,up)*cav*.9);
    tc.multiplyScalar(.9 + h3(v.x*31,v.y*31,v.z*31)*.18);
    c[i*3] = tc.r; c[i*3+1] = tc.g; c[i*3+2] = tc.b; }

const LEAF_MAT = (()=>{ const n = TEX.lawn.normal.clone(); n.needsUpdate = true; n.repeat.set(5, 3); return new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.8, normalMap:n, normalScale:new THREE.Vector2(1.4,1.4), envMapIntensity:.28 }); })();
const BARK_MAT = (()=>{ const m = TEX.bark.map.clone(), n = TEX.bark.normal.clone(); m.needsUpdate = n.needsUpdate = true; m.repeat.set(2, 1.5); n.repeat.set(2, 1.5);

function makeDiorama(def){

  const push = (x,z,edge)=>{ const y = edge ? 0 : d.h(x,z); pos.push(x,y,z); uvs.push(x/2.6, z/2.6); tc.set(def.color(x,z,y)).multiplyScalar((.94 + vnoise(x*5+3,z*5+1)*.1)*(def.ground === 'soil' ? 1.0 : 1.22));

  push(0,0,false);

  { const wt = TEX.wood.map.clone(); wt.needsUpdate = true; wt.repeat.set(10, 1); const wn = TEX.wood.normal.clone(); wn.needsUpdate = true; wn.repeat.set(10,1);
    d.group.add(mesh(new THREE.CylinderGeometry(R+.02, R+.22, 1.0, 96, 1, true), new THREE.MeshStandardMaterial({ color:'#6A4631', map:wt, normalMap:wn, normalScale:new THREE.Vector2(.4,.4), roughness:.5, envMapIntensity:.5 }), 0, -.5, 0)); }

function put(d, obj, lx, lz, dy=0){ obj.position.set(lx, d.h(lx,lz)+dy, lz); d.group.add(obj);
  if (d.occ && !obj.userData.noOcc){ const b = new THREE.Box3().setFromObject(obj), sz = b.getSize(new V3()); if (sz.y > .12) d.occ.push([lx, lz, Math.max(sz.x, sz.z)*.5, Math.min(1, sz.y/.8)]); }
  return obj; }
const STONE_C = {};
function STONE(col){ return STONE_C[col] || (STONE_C[col] = new THREE.MeshStandardMaterial({ color:col, map:TEX.stone.map, normalMap:TEX.stone.normal, normalScale:new THREE.Vector2(.9,.9), roughness:.92, envMapIntensity:.35 })); }
function rock(d, lx, lz, s, col='#A7A197', flat=.6){

  for (let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const n = 1 + (fbm(v.x*3+lx, v.z*3+lz)-.5)*.35; v.multiplyScalar(n); v.y *= flat; p.setXYZ(i,v.x,v.y,v.z); }

}
function shrub(d, lx, lz, s=1, cols=['#4A6238','#6B8248','#93A865']){

    g.add(mesh(new THREE.SphereGeometry(.035*s, 8, 6), M(pick(['#EDE3D3','#E2B7A8'])), Math.cos(a)*Math.cos(e)*.6*s, .38*s + Math.sin(e)*.44*s, Math.sin(a)*Math.cos(e)*.6*s)); }

function tree(d, lx, lz, s=1, cols=['#40573A','#62794A','#94A866'], ch=2.15){

function flowers(d, n, test, cols=['#EDE5D4','#D6ADA2','#D5B461','#B5A5C3']){

{

function mergeParts(parts){
  let n = 0, m = 0; parts.forEach(([g])=>{ n += g.attributes.position.count; m += g.index ? g.index.count : g.attributes.position.count; });
  const pos = new Float32Array(n*3), nor = new Float32Array(n*3), col = new Float32Array(n*3), idx = new Uint32Array(m);
  let vo = 0, io = 0; const v = new V3(), nm = new THREE.Matrix3();
  parts.forEach(([g, mat4, c])=>{ const P = g.attributes.position, N = g.attributes.normal, cnt = P.count; nm.getNormalMatrix(mat4); tc.set(c);
    for (let i=0;i<cnt;i++){ v.fromBufferAttribute(P,i).applyMatrix4(mat4); pos.set([v.x,v.y,v.z], (vo+i)*3);
      v.fromBufferAttribute(N,i).applyMatrix3(nm).normalize(); nor.set([v.x,v.y,v.z], (vo+i)*3); col.set([tc.r,tc.g,tc.b], (vo+i)*3); }
    if (g.index) for (let q=0;q<g.index.count;q++) idx[io+q] = g.index.getX(q) + vo; else for (let q=0;q<cnt;q++) idx[io+q] = q + vo;
    io += g.index ? g.index.count : cnt; vo += cnt; });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3)); out.setAttribute('normal', new THREE.BufferAttribute(nor,3)); out.setAttribute('color', new THREE.BufferAttribute(col,3));
  out.setIndex(new THREE.BufferAttribute(idx,1)); return out;
}

/* ============================================================
   动物模型 —— 光滑体块 + 柔和渐变，只抓决定性的形体特征

/* ---------------- 玉米蛇：身体跟着头走过的路径 ---------------- */
function makeSnake(){
  const root = grp(), NR = 72, RAD = 10, L = 1.45;
  const rad = s=> .042 * (s < .05 ? .8 + s/.05*.2 : s < .55 ? 1 : lerp(1, .1, (s-.55)/.45));
  const g = new THREE.BufferGeometry(), pos = new Float32Array((NR+1)*(RAD+1)*3), col = new Float32Array((NR+1)*(RAD+1)*3), idx = [];
  for (let i=0;i<=NR;i++){ const s = i/NR;
    for (let j=0;j<=RAD;j++){ const th = j/RAD*Math.PI*2, up = Math.sin(th), n = i*(RAD+1)+j;
      const f = (s*15) % 1; let c;
      if (up < -.35) c = (Math.floor(s*40)%2 && Math.cos(th) > 0) ? '#2C2420' : '#EDE3CD';
      else if (f > .1 && f < .52) c = (f < .14 || f > .48) ? '#2A201B' : '#B63A27';
      else c = mix('#D9793F','#E39A5A', Math.abs(up));
      tc.set(c); col[n*3] = tc.r; col[n*3+1] = tc.g; col[n*3+2] = tc.b;
      if (i < NR && j < RAD){ const a = n, b = n+1, c2 = n+RAD+1, d = n+RAD+2; idx.push(a,c2,b, b,c2,d); }
    } }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3)); g.setAttribute('color', new THREE.BufferAttribute(col,3)); g.setIndex(idx);
  const m = mesh(g, new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.42, metalness:0 })); m.frustumCulled = false; root.add(m);
  const head = grp(root);
  head.add(blob(.05,.034,.075, (x,y,z)=> y < -.3 ? '#EDE3CD' : (Math.abs(x) < .3 && z < .2 && z > -.4) ? '#B63A27' : '#D9793F', { fur:false, shape:v=>{ if (v.z > 0) v.x *= 1 - v.z*.3; } }));
  const eyes = pair(s=> at(head, eye(.011, 0,0,0, '#B5502C', .4), s*.036, .012, .035));
  const tongue = grp(head, 0, -.008, .07);
  pair(s=>{ const t = new THREE.CylinderGeometry(.003,.003,.05,4); t.rotateX(Math.PI/2); t.translate(0,0,.025); at(tongue, mesh(t, M('#9B2330')), s*.006, 0, .03, 0, s*.3, 0); });
  const t0 = new THREE.CylinderGeometry(.004,.004,.04,4); t0.rotateX(Math.PI/2); t0.translate(0,0,.02); tongue.add(mesh(t0, M('#9B2330')));
  tongue.scale.setScalar(.001);
  const trail = [];
  const A = new V3(), B = new V3(), T = new V3(), S = new V3(), U = new V3(), Y = new V3(0,1,0);
  function sample(dist, out, tan){
    let acc = 0;
    for (let i=0;i<trail.length-1;i++){ const l = trail[i].distanceTo(trail[i+1]);
      if (acc + l >= dist || i === trail.length-2){ const k = l > 0 ? clamp((dist-acc)/l, 0, 1.5) : 0;
        out.lerpVectors(trail[i], trail[i+1], k); tan.subVectors(trail[i+1], trail[i]).normalize(); return; }
      acc += l; }
    out.copy(trail[0]); tan.set(0,0,-1);
  }
  function update(){
    for (let i=0;i<=NR;i++){ const s = i/NR; sample(s*L, A, T);
      S.crossVectors(T, Y).normalize(); U.crossVectors(S, T).normalize(); const r = rad(s);
      for (let j=0;j<=RAD;j++){ const th = j/RAD*Math.PI*2, c = Math.cos(th), sn = Math.sin(th), n = (i*(RAD+1)+j)*3;
        pos[n] = A.x + (S.x*c + U.x*sn*(sn<0?.6:1))*r; pos[n+1] = A.y + r*.85 + (S.y*c + U.y*sn*(sn<0?.6:1))*r; pos[n+2] = A.z + (S.z*c + U.z*sn*(sn<0?.6:1))*r; } }
    g.attributes.position.needsUpdate = true; g.computeVertexNormals(); g.computeBoundingSphere();
    sample(0, A, T); head.position.set(A.x, A.y + .036, A.z); head.rotation.set(0, Math.atan2(-T.x, -T.z), 0);
    /* 修剪过长的路径 */
    let acc = 0; for (let i=0;i<trail.length-1;i++){ acc += trail[i].distanceTo(trail[i+1]); if (acc > L + .3){ trail.length = i+2; break; } }
  }
  return { root, body:root, head, eyes, tongue, trail, update, mesh:m, legs:[], world:true, L };
}

   .ell([0,.265,-.03],[.09,.095,.17],{ bone:'body', col:C0, k:.06 })
   .ell([0,.26,-.16],[.095,.1,.09],{ bone:'body', col:C0, k:.06 })
   .cap([0,.3,.17],[0,.36,.24],.06,.052,{ bone:'head', col:C0, k:.05 })
   .ell([0,.385,.28],[.072,.062,.066],{ bone:'head', col:o.face||C0, k:.04 })
   .ell([0,.365,.3],[.078,.045,.05],{ bone:'head', col:o.face||C0, k:.035 })

   .cap([0,.19,-.38],[0,.24,-.52],.02,.016,{ bone:'tail', col:P, k:.02, w:o.pw||1 });
  both(s=>{ const f = s>0?'fl':'fr', hh = s>0?'hl':'hr';
    S.cap([s*.045,.42,.27],[s*.06,.5,.265],.03,.003,{ bone:'head', col:P, k:.02, sq:[1,1,.42], w:o.pw||1 })
     .cap([s*.055,.22,.14],[s*.055,.08,.155],.03,.022,{ bone:f, col:C0, k:.04 })
     .cap([s*.055,.08,.155],[s*.055,.02,.16],.022,.02,{ bone:f, col:P, k:.02, w:o.pw||1 })
     .ell([s*.055,.016,.18],[.024,.016,.03],{ bone:f, col:P, k:.02, w:o.pw||1 })
     .ell([s*.065,.21,-.17],[.045,.075,.07],{ bone:hh, col:C0, k:.05 })
     .cap([s*.065,.16,-.19],[s*.06,.07,-.23],.028,.02,{ bone:hh, col:C0, k:.03 })
     .cap([s*.06,.07,-.23],[s*.06,.018,-.2],.02,.018,{ bone:hh, col:P, k:.02, w:o.pw||1 })
     .ell([s*.06,.015,-.18],[.023,.015,.03],{ bone:hh, col:P, k:.02, w:o.pw||1 }); });
  const m = sculptMesh(S, { furLen:.009, cblend:o.cb, paint:o.paint });
  const B = m.bones;
  const irisMat = new THREE.MeshStandardMaterial({ color:o.eye, roughness:.2, emissive:o.eye, emissiveIntensity:0 });
  const eyes = eyesOn(S, B.head, [[[.03,.4,.3],[.35,.05,1]],[[-.03,.4,.3],[-.35,.05,1]]], .016, o.eye, .35);
  eyes.forEach(e=>{ e.children[0].material = irisMat; e.scale.set(1,.78,1); });
  noseOn(S, B.head, [0,.36,.35], [0,0,1], .009, o.nose);
  const ears = both(s=> B.head.children.find(()=>false) || new THREE.Group());
  ears.forEach(e=> B.head.add(e));
  return { root:m.root, body:B.body, head:B.head, legs:[B.fl,B.fr,B.hl,B.hr], eyes, ears, tail:B.tail, irisMat };
}

/* ---------------- 豚鼠：没有尾巴的长面包，三花 ---------------- */
function makeGuineaPig(){
  const S = Sculpt(), W = '#EFE8DC', Gn = '#B8733A', K = '#33291F';
  S.bone('root',null,0,0,0).bone('body','root',0,.13,0).bone('head','body',0,.14,.13)
   .bone('fl','body',.07,.08,.12).bone('fr','body',-.07,.08,.12).bone('hl','body',.085,.09,-.13).bone('hr','body',-.085,.09,-.13);
  S.ell([0,.13,-.03],[.135,.115,.2],{ bone:'body', col:W, k:.06 })
   .ell([0,.13,-.13],[.14,.115,.11],{ bone:'body', col:W, k:.06 })
   .ell([0,.11,.09],[.115,.095,.1],{ bone:'body', col:W, k:.06 })
   .ell([0,.14,.18],[.09,.085,.095],{ bone:'head', col:W, k:.05 })
   .ell([0,.12,.245],[.058,.052,.05],{ bone:'head', col:W, k:.04 })
   .ell([0,.126,.285],[.024,.018,.012],{ bone:'head', col:'#C79A8E', k:.015, w:2 });
  both(s=>{ S.ell([s*.072,.205,.14],[.034,.03,.009],{ bone:'head', col:'#9A7B68', k:.012, rot:[.3,s*.4,s*.9] })
    .cap([s*.07,.08,.12],[s*.075,.01,.14],.025,.02,{ bone:s>0?'fl':'fr', col:'#D9B6A6', k:.03 })
    .ell([s*.085,.08,-.13],[.05,.06,.07],{ bone:s>0?'hl':'hr', col:W, k:.05 })
    .cap([s*.09,.03,-.12],[s*.09,.008,-.08],.02,.017,{ bone:s>0?'hl':'hr', col:'#D9B6A6', k:.02 }); });
  const m = sculptMesh(S, { furLen:.012, paint:(x,y,z,c)=>{ if (c.r < .8 || c.g < .75) return;
    const n = vn3(x*6.5+3.3, y*6.5+1, z*6.5+1.7), face = z > .12 && Math.abs(x) < .028 && y > .1;
    const t = face ? W : n < .4 ? K : n < .6 ? Gn : W; const k = face ? 1 : Math.min(1, Math.abs(n - (n < .5 ? .4 : .6))*14 + .2); c.lerp(new C3(t), k); } });
  const B = m.bones;
  const eyes = eyesOn(S, B.head, [[[.06,.16,.2],[1,.2,.35]],[[-.06,.16,.2],[-1,.2,.35]]], .02);
  return { root:m.root, body:B.body, head:B.head, legs:[B.fl,B.fr,B.hl,B.hr], eyes };
}

/* ---------------- 刺猬：尖鼻子 + 背上一片刺 ---------------- */
function makeHedgehog(){
  const S = Sculpt(), Sk = '#D9C6A6';
  S.bone('root',null,0,0,0).bone('body','root',0,.14,0).bone('head','body',0,.12,.16)
   .bone('fl','body',.08,.07,.1).bone('fr','body',-.08,.07,.1).bone('hl','body',.09,.07,-.12).bone('hr','body',-.09,.07,-.12);
  S.ell([0,.12,-.01],[.15,.1,.2],{ bone:'body', col:Sk, k:.06 })
   .ell([0,.115,.17],[.072,.068,.078],{ bone:'head', col:'#E4D5BC', k:.05 })
   .cap([0,.1,.21],[0,.075,.32],.045,.015,{ bone:'head', col:'#E8DBC4', k:.035 });
  both(s=>{ S.ell([s*.055,.165,.18],[.022,.025,.008],{ bone:'head', col:'#B39A80', k:.012, rot:[0,s*.6,0] })
    .cap([s*.08,.07,.1],[s*.085,.008,.12],.02,.017,{ bone:s>0?'fl':'fr', col:'#8C7760', k:.025 })
    .cap([s*.09,.07,-.12],[s*.09,.008,-.1],.022,.017,{ bone:s>0?'hl':'hr', col:'#8C7760', k:.025 }); });
  const m = sculptMesh(S, { furLen:.004 });
  const B = m.bones;
  /* 刺：一层深色底 + 几百根朝后倒伏的刺 */
  const quill = new THREE.Group(); onBone(B.body, quill, 0, .15, -.035);
  quill.add(blob(.18,.135,.235, (x,y,z)=> mix('#4E4036','#6B5A4A', vnoise(x*6,z*6)), { shape:v=>{ v.y += .05; }, noFur:true }));
  const cg = new THREE.ConeGeometry(.013, .12, 6); cg.translate(0, .06, 0);
  const N = 520, dark = new THREE.InstancedMesh(cg, M('#3E322A', { roughness:.6 }), N), light = new THREE.InstancedMesh(cg, M('#E3D5BC', { roughness:.6 }), N);
  let nd = 0, nl = 0; const o = new THREE.Object3D(), up = new V3(0,1,0), n = new V3(), t = new V3(), back = new V3(0,0,-1);
  for (let i=0;i<N*4 && (nd<N||nl<N);i++){ const th = rand(0,6.283), ph = Math.acos(1-2*Math.random());
    const x = Math.sin(ph)*Math.cos(th), y = Math.cos(ph), z = Math.sin(ph)*Math.sin(th);
    if (y < -.12 || z > .72 - y*.35) continue;
    n.set(x/.18, y/.135, z/.235).normalize(); t.copy(back).addScaledVector(n, -n.dot(back)).normalize();
    o.position.set(x*.175, y*.13 + .05*(1-y*y) + .004, z*.23);
    o.quaternion.setFromUnitVectors(up, n.clone().multiplyScalar(.42).add(t).normalize()); o.scale.setScalar(rand(.8,1.2)); o.updateMatrix();
    if (Math.random() < .35){ if (nl<N) light.setMatrixAt(nl++, o.matrix); } else if (nd<N) dark.setMatrixAt(nd++, o.matrix); }
  dark.count = nd; light.count = nl; dark.castShadow = light.castShadow = true; quill.add(dark); quill.add(light);
  const eyes = eyesOn(S, B.head, [[[.04,.14,.2],[.9,.2,.45]],[[-.04,.14,.2],[-.9,.2,.45]]], .019);
  noseOn(S, B.head, [0,.075,.3], [0,-.1,1], .018, '#16110E');
  return { root:m.root, body:B.body, head:B.head, quill, legs:[B.fl,B.fr,B.hl,B.hr], eyes };
}

const SCALE_MAT = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.75, envMapIntensity:.4 });
function makeBeardie(){
  const S = Sculpt(), T = '#C49A62';
  S.bone('root',null,0,0,0).bone('body','root',0,.06,0).bone('head','body',0,.07,.15).bone('tail','body',0,.06,-.19)
   .bone('fl','body',.08,.055,.1).bone('fr','body',-.08,.055,.1).bone('hl','body',.085,.055,-.12).bone('hr','body',-.085,.055,-.12);
  S.ell([0,.06,-.02],[.105,.042,.17],{ bone:'body', col:T, k:.05 })
   .ell([0,.064,.1],[.085,.042,.08],{ bone:'body', col:T, k:.05 })
   .ell([0,.072,.2],[.068,.038,.065],{ bone:'head', col:T, k:.04 })
   .ell([0,.062,.17],[.078,.034,.05],{ bone:'head', col:T, k:.035 })
   .ell([0,.068,.255],[.034,.026,.034],{ bone:'head', col:T, k:.03 })
   .cap([0,.06,-.19],[0,.04,-.42],.034,.013,{ bone:'tail', col:T, k:.03 })
   .cap([0,.04,-.42],[.05,.02,-.6],.013,.004,{ bone:'tail', col:'#A98252', k:.01 });
  both(s=>{ const f = s>0?'fl':'fr', h = s>0?'hl':'hr';
    S.cap([s*.08,.055,.1],[s*.14,.05,.12],.019,.015,{ bone:f, col:T, k:.02 })
     .cap([s*.14,.05,.12],[s*.15,.008,.15],.015,.011,{ bone:f, col:'#B78D58', k:.012 })
     .cap([s*.085,.055,-.12],[s*.15,.05,-.13],.023,.017,{ bone:h, col:T, k:.02 })
     .cap([s*.15,.05,-.13],[s*.16,.008,-.1],.017,.011,{ bone:h, col:'#B78D58', k:.012 }); });
  const m = sculptMesh(S, { fur:false, mat:SCALE_MAT, res:64, paint:(x,y,z,c)=>{ c.multiplyScalar(.85 + vn3(x*45,y*45,z*45)*.3); c.lerp(new C3('#E6D2A8'), sstep(.045,.028,y)*.7); } });
  const B = m.bones, head = B.head, body = B.body;
  const cone = new THREE.ConeGeometry(.012, .045, 6);
  for (let i=0;i<16;i++){ const s = i%2 ? 1 : -1, k = Math.floor(i/2)/7; const c = mesh(cone, M('#C69C63')); onBone(body, c, s*(.1 - k*.018), .065, .13 - k*.3); c.rotation.set(0,0,s*-1.2); }
  const beardMat = new THREE.MeshStandardMaterial({ color:'#C9A26C', roughness:.8 });
  const beard = onBone(head, new THREE.Group(), 0, .042, .18);
  for (let i=0;i<13;i++){ const a = -1.3 + i*(2.6/12); const c = new THREE.Mesh(cone, beardMat); c.castShadow = true;
    c.position.set(Math.sin(a)*.07, 0, Math.cos(a)*.055-.015); c.rotation.set(Math.cos(a)*1.9, 0, -Math.sin(a)*1.9); beard.add(c); }
  const eyes = eyesOn(S, head, [[[.045,.085,.21],[1,.4,.3]],[[-.045,.085,.21],[-1,.4,.3]]], .012, '#7A5A34', .7);
  return { root:m.root, body, head, legs:[B.fl,B.fr,B.hl,B.hr], eyes, beard, beardMat, tail:B.tail, sprawl:true };
}

function makeBirdS(o){
  const s = o.s, S = Sculpt(), v = a=> a.map(q=>q*s);
  S.bone('root',null,0,0,0).bone('body','root',...v([0,.09,0])).bone('head','body',...v([0,.165,.03]))
   .bone('wingL','body',...v([.045,.14,0])).bone('wingR','body',...v([-.045,.14,0])).bone('tail','body',...v([0,.06,-.045]))
   .bone('lL','body',...v([.018,.045,.01])).bone('lR','body',...v([-.018,.045,.01]));
  S.ell(v([0,.1,-.005]),v([.044,.08,.05]),{ bone:'body', col:o.body, k:.04*s, rot:[.42,0,0] })
   .ell(v([0,.092,.02]),v([.043,.056,.044]),{ bone:'body', col:o.breast||o.body, k:.04*s })
   .ell(v([0,.172,.035]),v([.04,.04,.043]),{ bone:'head', col:o.head, k:.035*s })
   .cap(v([0,.172,.068]),v([0,.162,.086]),.012*s,.007*s,{ bone:'head', col:o.beak, k:.005*s, w:4 })
   .cap(v([0,.162,.086]),v([0,.146,.088]),.007*s,.002*s,{ bone:'head', col:o.beak, k:.003*s, w:4 })
   .cap(v([0,.045,-.04]),v([0,-.005,-.04-o.tl]),.02*s,.01*s,{ bone:'tail', col:o.tail, k:.015*s, sq:[1,.38,1] });
  if (o.cere) S.ell(v([0,.182,.07]),v([.012,.007,.006]),{ bone:'head', col:o.cere, k:.004*s, w:3 });
  both(q=>{ S.ell(v([q*.05,.105,-.022]),v([.013,.062,.044]),{ bone:q>0?'wingL':'wingR', col:o.wing, k:.012*s, rot:[.45,0,q*.08] })
    .cap(v([q*.018,.045,.01]),v([q*.018,0,.02]),.006*s,.005*s,{ bone:q>0?'lL':'lR', col:'#9C8F86', k:.004*s });
    if (o.cheek) S.ell(v([q*.037,.162,.052]),v([.013,.013,.006]),{ bone:'head', col:o.cheek, k:.004*s, w:4, rot:[0,q*.8,0] }); });
  const m = sculptMesh(S, { furLen:.004*s, cblend:.006*s, paint:o.paint });
  const B = m.bones;
  const eyes = eyesOn(S, B.head, [[v([.02,.18,.05]),[1,.25,.4]],[v([-.02,.18,.05]),[-1,.25,.4]]], .011*s);
  let crest = null;
  if (o.crest){ crest = onBone(B.head, new THREE.Group(), ...v([0,.2,.045]));
    for (let i=0;i<5;i++){ const c = new THREE.ConeGeometry(.007*s, .11*s, 6); c.translate(0,.055*s,0); at(crest, mesh(c, M(o.crest)), (i-2)*.005*s, 0, -i*.007*s, -.35 - i*.06, 0, 0); }
    crest.rotation.x = -.5; }
  return { root:m.root, body:B.body, head:B.head, legs:[B.lL,B.lR], eyes, wings:[B.wingL,B.wingR], tail:B.tail, crest, bird:true };
}

/* ============================================================
   生活 —— 昼夜、食物、通用行为 + 各物种的特殊动作
   ============================================================ */
night = 0; nightTarget = 0;
const isNight = ()=> night > .5;
const foods = [];
const FOOD = { leaf:{ name:'菜叶' }, seed:{ name:'种子' }, bug:{ name:'虫子' }, meat:{ name:'肉粒' } };
const TAU = Math.PI*2;
const W = (d, lx, lz)=> new V3(d.cx+lx, d.h(lx,lz), d.cz+lz);
const pondD = (x,z)=>{ const d = DIO.pond; return d.pd(x-d.cx, z-d.cz); };
const inWater = (d, x, z)=> d.id === 'pond' && pondD(x,z) < 1;
DIO.pond.water.material.opacity = .58;

/* 各景观里不能穿过去的东西（局部坐标） */
const BLOCKS = {
  pond:[[-3.6,-2.9,.35],[3.4,-3.2,.3],[.6,-2.8,.6],[1.0,.6,.2],[2.65,2.5,.7]],
  field:[[-2.3,-2.9,1.3],[2.6,-1.8,.95],[-.4,-1.3,.2],[4.0,3.2,.3],[-1.8,3.6,.55],[2.7,1.3,.35]],
  rock:[[2.0,.7,.7],[-2.6,1.8,.55],[3.8,1.9,.3],[-3.6,3.0,.25],[3.2,-3.1,.25],[2.4,2.6,.2],[-1.5,-1.4,.5],[.5,-1.8,.55],[-2.3,-2.4,.45],[.3,-3.6,.4],[3.4,-1.5,.35],[.7,3.0,.25]],
  yard:[[-3.2,-.6,.35],[2.7,-1.0,.25],[-2.3,-2.9,.35],[-1.65,-3.0,.3],[3.0,-2.9,.35],[1.4,-2.2,.2],[4.3,.4,.6],[-4.5,2.2,.6],[2.8,2.3,.75]],
};
function walkable(d, x, z){
  const lx = x-d.cx, lz = z-d.cz;
  if (Math.hypot(lx,lz) > R-.6) return false;
  if (d.id === 'pond' && d.pd(lx,lz) < 1.15) return false;
  if (d.id === 'yard' && lz < -3.0) return false;
  return !BLOCKS[d.id].some(([bx,bz,r])=> Math.hypot(lx-bx, lz-bz) < r);
}
function pathOK(d, a, b){ for (let k=1;k<=6;k++){ const t = k/6; if (!walkable(d, lerp(a.x,b.x,t), lerp(a.z,b.z,t))) return false; } return true; }
function wanderSpot(b){
  const sp = b.sp, h = b.homeW;
  for (let i=0;i<30;i++){ const a = rand(0,TAU), r = Math.sqrt(Math.random())*(sp.roam||2), x = h.x+Math.cos(a)*r, z = h.z+Math.sin(a)*r;
    const p = new V3(x,0,z); if (walkable(b.d, x, z) && pathOK(b.d, b.pos, p)) return p; }
  return h.clone();
}

/* ---------- 水波、烟尘 ---------- */
const ripples = [];
function ripple(x, z, big=1){
  const m = new THREE.Mesh(new THREE.RingGeometry(.08, .11, 32), new THREE.MeshBasicMaterial({ color:'#ffffff', transparent:true, opacity:.6, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.set(x, WATER_Y+.012, z); scene.add(m); ripples.push({ m, t:0, big });
}
const puffs = [];
function puff(x, y, z, col, n=14, spread=.5, up=.6, life=1.2, size=.03){
  for (let i=0;i<n;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(size*rand(.6,1.4), 6, 5), new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:.8, depthWrite:false }));
    m.position.set(x+rand(-.05,.05), y, z+rand(-.05,.05)); scene.add(m);
    puffs.push({ m, v:new V3(rand(-spread,spread), rand(.2,1)*up, rand(-spread,spread)), t:0, life:life*rand(.7,1.2) });
  }
}

/* ---------- 生成 ---------- */
const beasts = [], BY = {};
const EAT_T = { leaf:2.8, seed:2.6, bug:2.2, meat:2.4 };
function spawn(kind){
  const sp = SPECIES[kind], d = DIO[sp.dio], m = PREBUILT[kind] || MAKERS[kind]();
  const b = Object.assign(m, { kind, sp, d, face:rand(0,TAU), state:'idle', t:rand(.5,2), tgt:null, step:0, act:'', eating:null, hidden:false,
    freeze:0, task:null, sleepK:0, blink:0, blinkT:rand(1,4), hp:0, hy:0, bob:0, moving:false, lift:0 });
  const hm = sp.home || [0,0]; b.homeW = W(d, hm[0], hm[1]);
  b.pos = m.world ? b.homeW.clone() : m.root.position; b.pos.copy(b.homeW);
  if (sp.sleep){ b.den = W(d, sp.sleep.at[0], sp.sleep.at[1]); }
  b.baseY = m.body ? m.body.position.y : 0;
  if (m.head) m.head.userData.base = m.head.position.clone(); (m.feet||[]).forEach(f=> f.userData.base = f.position.clone());
  (m.eyes||[]).forEach(e=> e.userData.sy = e.scale.y);
  sp.speed = sp.speed || .7; sp.stride = TAU/((sp.size||.5)*.55);
  m.root.traverse(o=>{ if (o.isMesh) o.userData.beast = b; });
  scene.add(m.root); beasts.push(b); BY[kind] = b;
  return b;
}
Object.keys(SPECIES).forEach(spawn);
['siamese','bluecat'].forEach(k=> BY[k].root.scale.setScalar(1.15));

/* 藏起来的动物：点它的窝就等于点它 */
const denHits = [];
beasts.forEach(b=>{ if (b.sp.sleep && b.sp.sleep.mode === 'hide'){
  const h = new THREE.Mesh(new THREE.SphereGeometry(.55, 8, 6), new THREE.MeshBasicMaterial({ visible:false }));
  h.position.copy(b.den).y += .25; h.userData.beast = b; h.userData.den = true; scene.add(h); denHits.push(h); } });

/* ---------- 食物 ---------- */
function foodMesh(type){
  const g = new THREE.Group();
  if (type === 'leaf') for (let i=0;i<3;i++){ const l = blob(.13,.018,.08, ['#7FA04E','#8DAE58','#6E9243'][i], { w:12, h:6, shape:v=>{ v.y += v.x*v.x*.4; } });
    l.position.set(rand(-.08,.08), .02+i*.018, rand(-.08,.08)); l.rotation.y = rand(0,6); g.add(l); }
  if (type === 'seed') for (let i=0;i<14;i++){ const s = blob(.022,.014,.032, i%3 ? '#D8C08A' : '#6B5A45', { w:8, h:6 });
    s.position.set(rand(-.12,.12), .012, rand(-.12,.12)); s.rotation.y = rand(0,6); g.add(s); }
  if (type === 'bug') for (let i=0;i<4;i++){ const bug = new THREE.Group();
    bug.add(blob(.03,.022,.05,'#3A2E22',{ w:8, h:6 }).translateY(.025)); bug.add(blob(.018,.016,.018,'#2A2118',{ w:8, h:6 }).translateY(.03).translateZ(.045));
    bug.position.set(rand(-.13,.13), 0, rand(-.13,.13)); bug.rotation.y = rand(0,6); g.add(bug); }
  if (type === 'meat') for (let i=0;i<4;i++){ const c = blob(.04,.032,.045, (x,y,z)=> mix('#9E3F35','#C06A58', y*.5+.5), { w:10, h:8, fur:false });
    c.position.set(rand(-.1,.1), .03, rand(-.1,.1)); c.rotation.y = rand(0,6); g.add(c); }
  return g;
}
function dropFood(type, p, d){
  const wet = inWater(d, p.x, p.z);
  const y = wet ? WATER_Y : d.ground(p.x, p.z);
  const g = foodMesh(type); g.position.set(p.x, y+.5, p.z); g.userData.fall = .5; scene.add(g);
  const f = { type, pos:new V3(p.x, y, p.z), g, d, claimed:null, t:0, wet };
  foods.push(f);
  if (wet) setTimeout(()=>ripple(p.x, p.z), 250);
  /* 玉米蛇：什么都不理 */
  const c = BY.corn;
  if (d.id === 'field' && !c.hidden && isNight() && Math.hypot(p.x-c.pos.x, p.z-c.pos.z) < 3){
    setTimeout(()=>{ if (foods.includes(f) || true){ c.task = tongueTask(c, 2); seeObs('corn','ignore', true); } }, 2200); }
  return f;
}
function removeFood(f){ const i = foods.indexOf(f); if (i < 0) return; scene.remove(f.g); foods.splice(i, 1); beasts.forEach(b=>{ if (b.eating === f) b.eating = null; }); }

function awake(sp){ return sp.sched === 'any' ? true : sp.sched === 'day' ? !isNight() : isNight(); }
function reachable(b, f){
  const k = b.kind;
  if (f.d !== b.d || !b.sp.diet.includes(f.type) || !awake(b.sp)) return false;
  if (k === 'frog') return pondD(f.pos.x, f.pos.z) < 1.45;
  if (k === 'axolotl' || k === 'betta') return f.wet;
  return !f.wet;
}
function nearestFood(b){
  let best = null, bd = 99;
  foods.forEach(f=>{
    const flock = b.sp.custom === 'bird' && f.type === 'seed';
    if (f.claimed && f.claimed !== b && !flock) return;
    if (f.t < .5 || !reachable(b, f)) return;
    const d = Math.hypot(f.pos.x-b.pos.x, f.pos.z-b.pos.z);
    if (!f.claimed && !flock && beasts.some(o=> o !== b && !o.eating && !o.task && reachable(o, f) && Math.hypot(f.pos.x-o.pos.x, f.pos.z-o.pos.z) < d - .3)) return;
    if (d < bd){ bd = d; best = f; }
  });
  return best;
}

/* ---------- 通用动作 ---------- */
function turnTo(b, x, z, dt, k=6){
  const want = Math.atan2(x-b.pos.x, z-b.pos.z);
  let d = want - b.face; d = Math.atan2(Math.sin(d), Math.cos(d)); b.face += d*Math.min(1, dt*k);
}
function walk(b, dt, mul=1, stop=.05){
  const dx = b.tgt.x-b.pos.x, dz = b.tgt.z-b.pos.z, dist = Math.hypot(dx,dz);
  if (dist < stop) return true;
  turnTo(b, b.tgt.x, b.tgt.z, dt, 7);
  const s = Math.min(dist, b.sp.speed*mul*dt); b.pos.x += dx/dist*s; b.pos.z += dz/dist*s;
  b.step += s*b.sp.stride; b.moving = true;
  return false;
}
const pickAct = (a)=> Array.isArray(a) ? a[isNight() ? 1 : 0] : a;
function approach(b, f){ const a = Math.atan2(f.pos.x-b.pos.x, f.pos.z-b.pos.z), r = (b.sp.size||.5)*.45;
  return new V3(f.pos.x - Math.sin(a)*r, 0, f.pos.z - Math.cos(a)*r); }
function finishEat(b){
  const f = b.eating; if (f) removeFood(f); b.eating = null;
  seeObs(b.kind, b.sp.eatObs, true);
  b.state = 'idle'; b.t = rand(1,2);
  if (AFTER_EAT[b.kind]) AFTER_EAT[b.kind](b, f);
}

/* ---------- 通用陆地行为 ---------- */
function liveLand(b, dt, time){
  const sp = b.sp;
  if (b.task){ if (b.task(dt, time)) b.task = null; return; }
  if (!awake(sp)){
    if (b.eating){ b.eating.claimed = null; b.eating = null; }
    if (b.state !== 'sleep'){
      if (b.state !== 'home'){ b.tgt = b.den.clone(); b.state = 'home'; }
      b.act = isNight() ? '天黑了，往窝里走' : '天亮了，往窝里走';
      if (walk(b, dt, 1.2)){ b.state = 'sleep'; if (sp.sleep.mode === 'hide') b.hidden = true; if (sp.sleep.face != null) b.face = sp.sleep.face; }
    } else b.act = sp.sleep.act;
    return;
  }
  if (b.state === 'sleep' || b.state === 'home'){ if (b.hidden){ b.hidden = false; EMERGE[b.kind] && EMERGE[b.kind](b); } b.state = 'idle'; b.t = rand(.3,1); }
  if (b.freeze > 0){ b.act = FREEZE_ACT[b.kind] || b.act; return; }
  const f = !b.eating && nearestFood(b);
  if (f){ f.claimed = b; b.eating = f; b.tgt = approach(b, f); b.state = 'toFood'; }
  if (b.state === 'toFood'){
    if (!b.eating){ b.state = 'idle'; b.t = .5; return; }
    b.act = '闻到吃的了，凑过去';
    if (walk(b, dt, 1.4)){ b.state = 'eat'; b.t = EAT_T[b.eating.type]; }
  } else if (b.state === 'eat'){
    if (!b.eating){ b.state = 'idle'; b.t = .5; return; }
    turnTo(b, b.eating.pos.x, b.eating.pos.z, dt);
    b.act = `正在吃${FOOD[b.eating.type].name}`; b.hp = .4 + Math.sin(time*16)*.07; b.t -= dt;
    if (b.t <= 0) finishEat(b);
  } else if (b.state === 'walk'){
    b.act = pickAct(sp.walkAct) || '走来走去';
    if (walk(b, dt)){ b.state = 'idle'; b.t = rand(1.5,4); }
  } else {
    b.act = pickAct(sp.idleAct) || '待着';
    b.t -= dt; IDLE[b.kind] && IDLE[b.kind](b, dt, time);
    if (b.t <= 0){ b.tgt = (SPOT[b.kind] && SPOT[b.kind](b)) || wanderSpot(b); b.state = 'walk'; }
  }
}

/* ---------- 各物种的小习惯 ---------- */
const FREEZE_ACT = { hedgehog:'缩成了一颗刺球', rabbit:'僵住不动，竖着耳朵听', bluecat:'压低身子，一动不动' };
const IDLE = {
  guinea:(b,dt,t)=>{ b.hp = .5 + Math.sin(t*11)*.05; },
  rabbit:(b,dt,t)=>{ b.hp = isNight() ? -.1 : (Math.sin(t*.9) > 0 ? .45 : 0); },
  hedgehog:(b,dt,t)=>{ b.hp = .3 + Math.sin(t*10)*.15; b.hy = Math.sin(t*2)*.4; },
  hamster:(b,dt,t)=>{ b.hp = Math.sin(t*9)*.1; },
  rat:(b,dt,t)=>{ b.hp = -.3; b.hy = Math.sin(t*1.7)*.6; },
  dog:(b,dt,t)=>{ b.hy = Math.sin(t*.7)*.4; },
  chinchilla:(b,dt,t)=>{ b.hp = Math.sin(t*6)*.1; },
  gecko:(b,dt,t)=>{ b.hy = Math.sin(t*.8)*.3; },
};
const SPOT = {
  beardie:b=> !isNight() && Math.random() < .75 ? W(b.d, 2.0, .68) : null,
};
const EMERGE = {
  corn:b=>{ const p = b.den; b.trail.length = 0; for (let i=0;i<46;i++){ const x = p.x+.35, z = p.z+.3 - i*.035; b.trail.push(new V3(x, b.d.ground(x,z), z)); } b.pos.set(p.x+.35, 0, p.z+.3); },
  ferret:b=>{ b.pos.copy(b.den); },
};
const AFTER_EAT = {
  guinea:(b)=>{ b.task = popcornTask(b); },
  hamster:(b)=>{ b.task = stashTask(b); },
};
/* 蜥蜴站在石头上时抬高 */
function liftOf(b){
  if (b.kind === 'beardie'){ const d = b.d, c = W(d, 2.0, .7), dd = Math.hypot(b.pos.x-c.x, b.pos.z-c.z);
    return sstep(.72, .3, dd) * (d.baskTop - d.h(2.0,.7)); }
  return 0;
}

/* ---------- 任务：一小段连续的动作 ---------- */
function popcornTask(b){ let t = 2.4;
  setTimeout(()=>seeObs('guinea','popcorn', true), 1300);
  return (dt)=>{ t -= dt; b.act = '开心得原地蹦——爆米花跳！';
    const k = ((2.4-t) % .6)/.6; b.bob = Math.sin(k*Math.PI)*.34; b.face += dt*6*(t > 1.2 ? 1 : -1);
    if (t <= 0){ b.bob = 0; b.state = 'idle'; b.t = 1.5; return true; } }; }
function stashTask(b){ let ph = 0, t = 0; b.tgt = b.den.clone();
  return (dt)=>{
    if (ph === 0){ b.act = '鼓着腮帮子往洞里跑'; if (walk(b, dt, 1.3)){ b.hidden = true; ph = 1; t = 2.2; } }
    else { b.act = '在洞里藏粮'; t -= dt; if (t <= 0){ b.hidden = false; b.cheekK = 0; b.state = 'idle'; b.t = 1; return true; } } }; }
function tongueTask(b, n){ let t = n*.9; return (dt)=>{ t -= dt; b.act = '吐着信子，对你撒的东西毫无兴趣'; b.tongueK = (t % .9) < .35 ? 1 : 0; if (t <= 0){ b.tongueK = 0; return true; } }; }
function fetchTask(b){
  const d = b.d, ball = d.ball, start = b.pos.clone();
  let to; for (let i=0;i<20;i++){ const a = rand(0,TAU), r = rand(2,3.4); to = new V3(start.x+Math.cos(a)*r, 0, start.z+Math.sin(a)*r); if (walkable(d, to.x, to.z)) break; }
  const from = new V3(); ball.getWorldPosition(from); let ph = 0, k = 0;
  const lx = to.x-d.cx, lz = to.z-d.cz;
  return (dt, time)=>{
    b.happy = 1;
    if (ph === 0){ b.act = '盯着球，准备冲！'; k += dt/1.1; turnTo(b, to.x, to.z, dt, 5);
      ball.position.set(lerp(from.x-d.cx, lx, k), lerp(from.y, d.h(lx,lz)+.13, k) + Math.sin(k*Math.PI)*1.4, lerp(from.z-d.cz, lz, k));
      if (k >= 1){ ph = 1; b.tgt = to; sfx.thump(); } }
    else if (ph === 1){ b.act = '飞奔过去捡球'; if (walk(b, dt, 1.8, .35)){ ph = 2; seeObs('dog','fetch', true); sfx.bark(); } }
    else if (ph === 2){ b.act = '叼着球跑回来'; b.head.add(ball); ball.position.set(0, -.1, .24); b.tgt = start; if (walk(b, dt, 1.3, .1)){ ph = 3; k = 0; } }
    else { b.act = '把球放下，等你再扔'; k += dt; if (k > .5){ d.group.add(ball); const lxx = b.pos.x-d.cx + Math.sin(b.face)*.55, lzz = b.pos.z-d.cz + Math.cos(b.face)*.55;
        ball.position.set(lxx, d.h(lxx,lzz)+.13, lzz); b.state = 'idle'; b.t = 3; return true; } }
  }; }
function tunnelTask(b){
  const d = b.d, P = d.pipe, ax = Math.cos(P.a), az = -Math.sin(P.a);
  const A = W(d, P.x - ax*1.1, P.z - az*1.1), B = W(d, P.x + ax*1.1, P.z + az*1.1);
  let ph = 0, t = 0; b.tgt = A;
  return (dt)=>{
    if (ph === 0){ b.act = '看见管子，冲过去！'; if (walk(b, dt, 1.6)){ ph = 1; b.tgt = B; } }
    else if (ph === 1){ b.act = '钻进管子里了'; walk(b, dt, 1.2); b.hidden = Math.hypot(b.pos.x-P.x-d.cx, b.pos.z-P.z-d.cz) < .75;
      if (b.hidden) b.pos.y = d.ground(b.pos.x,b.pos.z); if (Math.hypot(b.pos.x-B.x, b.pos.z-B.z) < .06){ b.hidden = false; ph = 2; t = 1.4; } }
    else { b.act = '从另一头冒出来，横着乱蹦'; t -= dt; b.bob = Math.abs(Math.sin(t*9))*.12; b.face += Math.sin(t*9)*dt*3;
      if (t <= 0){ b.bob = 0; b.state = 'idle'; b.t = 1; return true; } }
  }; }
function dustTask(b){ let t = 3.2, p = 0;
  return (dt)=>{ t -= dt; p += dt; b.act = '在沙子里打滚洗澡'; b.roll = Math.sin(p*7)*1.6*sstep(0,.4,p)*sstep(0,.4,t);
    if (Math.random() < dt*6) puff(b.pos.x, b.pos.y+.05, b.pos.z, '#D9C29A', 4, .4, .5, 1, .035);
    if (t <= 0){ b.roll = 0; b.state = 'idle'; b.t = 1; return true; } }; }
function tickleTask(b){ let t = 2.2; sfx.squeak(); setTimeout(()=>sfx.squeak(), 300);
  return (dt)=>{ t -= dt; b.act = '被挠得直蹦，像在笑'; b.bob = Math.abs(Math.sin(t*10))*.14; b.face += Math.sin(t*6)*dt*4;
    if (t <= 0){ b.bob = 0; return true; } }; }
function beardTask(b){ let t = 3.2; sfx.huff();
  return (dt, time)=>{ t -= dt; b.act = '撑开「胡子」，使劲点头示威'; b.beardK = sstep(0,.4,3.2-t)*sstep(0,.5,t); b.hp = Math.sin(time*9)*.25*b.beardK;
    if (t <= 0){ b.beardK = 0; return true; } }; }
function blinkTask(b){ let t = 1.4; return (dt)=>{ t -= dt; b.act = '慢慢眨了一下眼'; b.blink = (t > .9 && t < 1.15) || (t > .3 && t < .5) ? 1 : 0; if (t <= 0){ b.blink = 0; return true; } }; }
function hairsTask(b){ let t = 2; return (dt, time)=>{ t -= dt; b.act = '抬起后腿，往外弹毛'; b.rear = sstep(0,.3,2-t)*sstep(0,.3,t);
    if (Math.random() < dt*10){ const a = b.face + Math.PI; puff(b.pos.x+Math.sin(a)*.15, b.pos.y+.12, b.pos.z+Math.cos(a)*.15, '#8A6A50', 3, .5, .3, .8, .008); }
    if (t <= 0){ b.rear = 0; return true; } }; }
function crestTask(b){ let t = 2.4; return (dt)=>{ t -= dt; b.crestK = sstep(0,.3,2.4-t)*sstep(0,.4,t); b.act = '竖起了头顶的毛'; if (t <= 0){ b.crestK = 0; return true; } }; }

/* ---------- 看一眼（选中时）：能看出来的事 ---------- */
const N_ = ()=> isNight();
const LOOK = {
  hedgehog:b=> !N_() ? 'sleep' : null,
  rabbit:b=> N_() ? 'ears' : null,
  hamster:b=> N_() ? (b.hidden ? null : 'night') : 'sleep',
  guinea:b=> b.state === 'popcorn' ? null : 'graze',
  frog:b=> N_() ? 'call' : 'pad',
  axolotl:b=>{ b.looks = (b.looks||0) + 1; return !seen.axolotl.gills ? 'gills' : (b.looks >= 2 ? 'kid' : null); },
  betta:b=> N_() ? 'nest' : null,
  rat:b=> !N_() ? 'shed' : null,
  ferret:b=> !N_() ? 'sleep' : null,
  corn:b=> N_() ? 'tongue' : 'hide',
  beardie:b=> !N_() ? 'bask' : null,
  gecko:b=> !N_() ? 'hide' : null,
  tarantula:b=> !N_() ? 'wait' : null,
  chinchilla:b=> !N_() ? 'hide' : null,
  dog:b=> N_() ? 'sleep' : null,
  siamese:b=> N_() ? 'eyes' : 'points',
  bluecat:b=> N_() ? 'coat' : 'shy',
  budgie:b=> N_() ? 'sleep' : null,
  cockatiel:b=> null,
  canary:b=> N_() ? 'quiet' : (b.sing > 0 ? 'sing' : null),
};
/* ---------- 碰一碰：它会怎么反应 ---------- */
function say(b, text, t=2.6){ b.say = { text, t }; }
const POKE = {
  hedgehog:b=>{ if (!N_()){ say(b,'缩了缩，接着睡'); return null; } b.freeze = 3.2; b.state = 'idle'; sfx.huff(); return 'curl'; },
  rabbit:b=>{ b.freeze = 2.4; b.thump = .5; b.state = 'idle'; sfx.thump(); return 'thump'; },
  hamster:b=>{ say(b, b.hidden ? '洞里没动静，它睡得很沉' : '一扭身躲开了你的手'); return null; },
  guinea:b=>{ sfx.squeak(); say(b,'吱吱叫着挪开了'); return null; },
  frog:b=>{ if (!b.jump){ const pad = pick(PADS.filter(p=>p !== b.pad)); b.jump = { from:b.pos.clone(), to:new V3(pad.x, PAD_Y, pad.z), k:0, dur:.6, then:'' }; b.pad = pad; } say(b,'扑通一跳，换了片荷叶'); return null; },
  axolotl:b=>{ b.gillK = 1; say(b,'鳃抖了抖，慢慢挪开'); return null; },
  betta:b=>{ if (N_()){ say(b,'守着泡泡窝，不肯走'); return null; } b.gulp = 1.6; return 'air'; },
  rat:b=>{ if (!N_()){ say(b,'棚屋里安安静静'); return null; } b.task = tickleTask(b); return 'tickle'; },
  ferret:b=>{ if (!N_()){ say(b,'睡得像一摊泥，完全没醒'); return null; } b.task = tunnelTask(b); return 'tunnel'; },
  corn:b=>{ if (!N_()){ say(b,'草垛下面没动静'); return null; } b.task = tongueTask(b, 2); say(b,'吐着信子打量你'); return null; },
  beardie:b=>{ if (N_()){ say(b,'睡着了，身子凉凉的'); return null; } b.task = beardTask(b); return 'beard'; },
  gecko:b=>{ if (!N_()){ say(b,'石头下面没动静'); return null; } b.task = blinkTask(b); return 'eyelid'; },
  tarantula:b=>{ if (!N_()){ say(b,'往洞里缩了缩'); return null; } b.task = hairsTask(b); return 'hairs'; },
  chinchilla:b=>{ if (!N_()){ say(b,'石缝里没动静'); return null; } b.task = dustTask(b); return 'dust'; },
  dog:b=>{ if (N_()){ say(b,'抬了抬眼皮，又睡了'); return null; } if (!b.task && !b.eating){ b.task = fetchTask(b); say(b,'你把球扔了出去！', 1.5); } sfx.bark(); return null; },
  siamese:b=>{ sfx.meow(); say(b,'「喵——」冲你叫了一长声'); return null; },
  bluecat:b=>{ b.freeze = 2; say(b,'压低身子，一动不动'); return null; },
  budgie:b=>{ if (N_()){ say(b,'睡着了，没理你'); return null; } sfx.chirp(); b.chat = 1.8; return 'chat'; },
  cockatiel:b=>{ if (N_()){ b.fright = 1.6; sfx.flap(); return 'fright'; } b.task = crestTask(b); sfx.chirp(); return 'crest'; },
  canary:b=>{ if (N_()){ say(b,'缩成一团，没出声'); return null; } b.sing = 2.4; sfx.song(); return 'sing'; },
};
function lookAt(b){ const k = LOOK[b.kind](b); return k ? seeObs(b.kind, k) : null; }
function poke(b){ const k = POKE[b.kind](b); return k ? seeObs(b.kind, k) : null; }
/* ---------- 喂它：把吃的放在它面前 ---------- */
function feedSpot(b){
  const d = b.d, c = b.sp.custom;
  if (c === 'betta' || c === 'axolotl'){ const p = pondSpot(.7); const a = Math.atan2(b.pos.x-DIO.pond.cx-DIO.pond.pond.x, b.pos.z-DIO.pond.cz-DIO.pond.pond.z);
    for (let r=.35; r<1.2; r+=.1){ const x = b.pos.x + Math.sin(b.face)*r*.6, z = b.pos.z + Math.cos(b.face)*r*.6; if (pondD(x,z) < .85) return new V3(x,0,z); } return p; }
  if (c === 'frog'){ for (let i=0;i<20;i++){ const a = rand(0,TAU), x = b.pos.x+Math.cos(a)*.45, z = b.pos.z+Math.sin(a)*.45; if (pondD(x,z) < .9) return new V3(x,0,z); } return b.pos.clone(); }
  const base = b.hidden || b.state === 'sleep' ? (b.den || b.pos) : b.pos;
  if (c === 'bird'){ for (let i=0;i<20;i++){ const a = rand(0,TAU), x = base.x+Math.cos(a)*rand(.5,1), z = base.z+Math.sin(a)*rand(.5,1); if (walkable(d,x,z)) return new V3(x,0,z); } }
  for (let i=0;i<30;i++){ const a = b.face + rand(-.9,.9), r = rand(.5,.8) + (b.sp.size||.5)*.35, x = base.x+Math.sin(a)*r, z = base.z+Math.cos(a)*r;
    if (Math.hypot(x-d.cx, z-d.cz) < R-.5 && !inWater(d,x,z)) return new V3(x,0,z); }
  return new V3(base.x+.5, 0, base.z);
}
function feed(b, type){
  const p = feedSpot(b), f = dropFood(type, p, b.d); sfx.click();
  if (!b.hidden && reachable(b, f)) f.claimed = b;   /* 喂给谁，就先留给谁 */
  const sleeping = !awake(b.sp) || b.hidden;
  if (b.kind === 'corn') return say(b, sleeping ? '草垛下面没动静' : '看了一眼，扭头走了', 3);
  if (sleeping) return say(b, '它在睡觉，没理会', 3);
  if (!b.sp.diet.includes(type)){ b.shake = 1.2; say(b, `闻了闻${FOOD[type].name}，没兴趣`, 3); }
}

/* ============================================================
   水里的三位和树上的三位：各自的一套
   ============================================================ */
const PADS = DIO.pond.pads.map(p=>({ x:DIO.pond.cx+p.x, z:DIO.pond.cz+p.z, r:p.r }));
const PAD_Y = WATER_Y + .03;
{ const f = BY.frog; f.pos.set(PADS[0].x, PAD_Y, PADS[0].z); f.pad = PADS[0]; f.callT = 1; }

function liveFrog(b, dt, time){
  const d = b.d;
  const f = !b.eating && !b.jump && nearestFood(b);
  if (f){ f.claimed = b; b.eating = f; const a = Math.atan2(f.pos.x-b.pos.x, f.pos.z-b.pos.z);
    const tx = f.pos.x - Math.sin(a)*.25, tz = f.pos.z - Math.cos(a)*.25;
    b.jump = { from:b.pos.clone(), to:new V3(tx, pondD(tx,tz) < 1 ? PAD_Y : d.ground(tx,tz), tz), k:0, dur:.55, then:'tongue' }; }
  if (b.jump){
    const J = b.jump; J.k = Math.min(1, J.k + dt/J.dur); turnTo(b, J.to.x, J.to.z, dt, 14);
    b.pos.lerpVectors(J.from, J.to, J.k); b.pos.y += Math.sin(J.k*Math.PI)*.55;
    b.hind.forEach(h=> h.scale.z = 1 + Math.sin(J.k*Math.PI)*.8);
    b.act = '一跳！';
    if (J.k >= 1){ if (pondD(b.pos.x,b.pos.z) < 1.05) ripple(b.pos.x, b.pos.z); b.jump = null; b.hind.forEach(h=> h.scale.z = 1);
      if (J.then === 'tongue'){ b.state = 'tongue'; b.tongueT = .5; } else { b.state = 'idle'; b.t = rand(3,7); } }
  } else if (b.state === 'tongue'){
    b.act = '舌头一弹！'; b.tongueT -= dt; const k = 1 - Math.abs(b.tongueT-.25)/.25;
    if (b.eating) turnTo(b, b.eating.pos.x, b.eating.pos.z, dt, 20);
    b.tongue.scale.set(1, 1, Math.max(.001, k*.3));
    if (b.tongueT <= 0){ b.tongue.scale.z = .001; if (b.eating) finishEat(b); b.state = 'idle'; b.t = 1.5;
      const pad = PADS.reduce((a,p)=> Math.hypot(p.x-b.pos.x,p.z-b.pos.z) < Math.hypot(a.x-b.pos.x,a.z-b.pos.z) ? p : a, PADS[0]);
      b.jump = { from:b.pos.clone(), to:new V3(pad.x, PAD_Y, pad.z), k:0, dur:.5, then:'' }; b.pad = pad; }
  } else {
    b.t -= dt;
    if (isNight()){
      b.callT -= dt;
      if (b.callT <= 0){ b.callT = rand(1.6,3.2); ripple(b.pos.x, b.pos.z, .7); if (hearable(b)) sfx.ribbit(); }
      const k = Math.max(0, 1-(b.callT-1.1)/.5) * (b.callT > .6 ? 1 : 0);
      b.throat.scale.setScalar(1 + Math.sin(Math.min(1,k)*Math.PI)*1.5);
      b.act = '鼓着喉咙叫：叮——叮——';
    } else { b.throat.scale.setScalar(1 + Math.sin(time*5)*.1); b.act = '趴在荷叶上一动不动，等虫子'; }
    if (b.t <= 0){ const pad = pick(PADS); if (pad !== b.pad){ b.jump = { from:b.pos.clone(), to:new V3(pad.x, PAD_Y, pad.z), k:0, dur:.6, then:'' }; b.pad = pad; } b.t = rand(5,10); }
    b.pos.y = pondD(b.pos.x,b.pos.z) < 1 ? PAD_Y + Math.sin(time*1.5)*.004 : b.d.ground(b.pos.x,b.pos.z);
  }
}

/* 斗鱼：水面下游，白天偶尔上来换气，夜里守着泡泡窝 */
const NEST = W(DIO.pond, -2.45, .15);
const nest = new THREE.Group(); nest.position.set(NEST.x, WATER_Y+.005, NEST.z); scene.add(nest);
for (let i=0;i<34;i++){ const a = rand(0,TAU), r = Math.sqrt(Math.random())*.22;
  const s = new THREE.Mesh(new THREE.SphereGeometry(rand(.012,.028), 10, 8), new THREE.MeshStandardMaterial({ color:'#FFFFFF', roughness:.1, transparent:true, opacity:.75 }));
  s.position.set(Math.cos(a)*r, 0, Math.sin(a)*r); nest.add(s); }
nest.scale.setScalar(.001);
function pondSpot(maxP){ const d = DIO.pond; for (let i=0;i<30;i++){ const a = rand(0,TAU), r = rand(0, d.pond.r*maxP), x = d.cx+d.pond.x+Math.cos(a)*r, z = d.cz+d.pond.z+Math.sin(a)*r; if (pondD(x,z) < maxP) return new V3(x,0,z); } return W(d, d.pond.x, d.pond.z); }
{ const b = BY.betta; b.pos.y = WATER_Y - .1; b.root.scale.setScalar(1.35); }
function liveBetta(b, dt, time){
  let ty = WATER_Y - .1;
  const f = !b.eating && nearestFood(b);
  if (f){ f.claimed = b; b.eating = f; b.state = 'toFood'; }
  if (b.state === 'toFood'){
    if (!b.eating){ b.state = 'idle'; b.t = 1; }
    else { b.tgt = b.eating.pos; ty = b.eating.g.position.y - .03; b.act = '冲向水面上的虫子';
      if (walk(b, dt, 2.2, .06)){ ripple(b.pos.x, b.pos.z, .6); finishEat(b); } }
  } else if (b.cmd){ b.tgt = b.cmd; b.act = '摆着尾巴游过去'; if (walk(b, dt, 1.4, .08)) b.cmd = null;
  } else if (b.gulp > 0){
    b.gulp -= dt; ty = WATER_Y - .015; b.act = '浮上水面，吸了一口空气';
    if (!b.gulped && b.gulp < .9){ b.gulped = true; ripple(b.pos.x, b.pos.z, .5); if (hearable(b)) sfx.bloop(); }
    if (b.gulp <= 0) b.gulped = false;
  } else if (isNight()){
    b.act = '在泡泡窝下面守着'; b.tgt = NEST; ty = WATER_Y - .06;
    if (walk(b, dt, .6, .12)) b.face += dt*.3;
  } else {
    b.act = '慢慢摆着长尾巴游';
    if (b.state !== 'swim' || walk(b, dt, 1, .1)){ b.state = 'swim'; b.tgt = pondSpot(.78); }
    b.t -= dt; if (b.t <= 0){ b.t = rand(9,16); b.gulp = 1.6; }
  }
  b.pos.y += (ty - b.pos.y)*Math.min(1, dt*3);
  nest.scale.setScalar(Math.max(.001, night));
}

/* 六角恐龙：池底一动不动，偶尔爬两步 */
function liveAxolotl(b, dt, time){
  const f = !b.eating && nearestFood(b);
  if (f){ f.claimed = b; b.eating = f; b.state = 'toFood'; }
  if (b.state === 'toFood'){
    if (!b.eating){ b.state = 'idle'; b.t = 3; }
    else { b.tgt = approach(b, b.eating); b.act = '慢慢游向沉下来的虫子';
      if (walk(b, dt, 2, .05)){ b.state = 'suck'; b.t = .6; } }
  } else if (b.state === 'suck'){
    b.act = '嘴一张——吸进去了！'; b.t -= dt; b.suckK = Math.sin(clamp(1-b.t/.6,0,1)*Math.PI);
    if (b.eating) turnTo(b, b.eating.pos.x, b.eating.pos.z, dt, 10);
    if (b.t <= 0){ b.suckK = 0; if (b.eating) finishEat(b); b.state = 'idle'; b.t = 5; }
  } else if (b.cmd){ b.tgt = b.cmd; b.act = '慢吞吞地爬过去'; if (walk(b, dt, .7, .06)){ b.cmd = null; b.state = 'idle'; b.t = 8; }
  } else if (b.state === 'walk'){
    b.act = '在池底慢慢爬'; if (walk(b, dt, .35)){ b.state = 'idle'; b.t = rand(8,15); }
  } else {
    b.act = '趴在池底，一动不动'; b.t -= dt;
    if (b.t <= 0){ b.tgt = pondSpot(.65); b.state = 'walk'; }
  }
  b.pos.y = DIO.pond.ground(b.pos.x, b.pos.z) + .02;
}

/* 鸟：在枝头和喂鸟台之间飞，下地吃种子，夜里回自己的枝头睡 */
const perchW = i=>{ const d = DIO.yard, p = d.perches[i]; return new V3(d.cx+p.x, p.y, d.cz+p.z); };
['budgie','cockatiel','canary'].forEach(k=>{ const b = BY[k]; b.perchI = b.sp.perch; b.pos.copy(perchW(b.perchI)); b.state = 'perch'; b.t = rand(3,8); b.face = rand(0,TAU); b.songT = rand(6,14); });
function fly(b, to, then){ b.flight = { from:b.pos.clone(), to, k:0, dur:Math.max(.7, b.pos.distanceTo(to)/2.4), then }; b.state = 'fly'; }
function liveBird(b, dt, time){
  const d = b.d;
  b.chat = Math.max(0, (b.chat||0)-dt); b.sing = Math.max(0, (b.sing||0)-dt); b.fright = Math.max(0, (b.fright||0)-dt);
  if (b.task && b.task(dt, time)) b.task = null;
  b.birdSleep = false;
  if (b.flight){
    const F = b.flight; F.k = Math.min(1, F.k + dt/F.dur);
    b.pos.lerpVectors(F.from, F.to, sstep(0,1,F.k)); b.pos.y += Math.sin(F.k*Math.PI)*(.35 + F.from.distanceTo(F.to)*.12);
    if (F.k < .9) turnTo(b, F.to.x, F.to.z, dt, 10);
    b.act = '扑棱着翅膀飞'; b.flap = 1;
    if (F.k >= 1){ b.flight = null; b.flap = 0; F.then && F.then(); }
    return;
  }
  const home = perchW(b.perchI);
  if (!awake(b.sp)){
    if (b.eating){ b.eating.claimed = null; b.eating = null; }
    if (b.state !== 'sleep'){ if (b.pos.distanceTo(perchW(b.sp.perch)) > .05){ b.perchI = b.sp.perch; fly(b, perchW(b.perchI), ()=>{ b.state = 'sleep'; }); } else b.state = 'sleep'; }
    b.birdSleep = b.state === 'sleep' && b.fright <= 0;
    b.act = b.fright > 0 ? '在黑暗里乱扑腾' : (b.kind === 'canary' ? '缩成一团，不唱了' : '蓬起羽毛，把头埋进背里睡觉');
    b.flap = b.fright > 0 ? 1 : 0;
    return;
  }
  if (b.state === 'sleep'){ b.state = 'perch'; b.t = 2; }
  if (b.state === 'ground'){ b.t -= dt; b.act = '在地上蹦蹦跳跳，东啄啄西啄啄'; b.hp = Math.sin(time*9) > .6 ? .6 : 0;
    if (Math.random() < dt*.8) b.face += rand(-1.2,1.2);
    if (b.t <= 0) fly(b, perchW(b.perchI), ()=>{ b.state = 'perch'; b.t = 6; }); return; }
  const f = !b.eating && nearestFood(b);
  if (f){ f.claimed = b; b.eating = f; const p = approach(b, f); p.y = d.ground(p.x, p.z);

  thump: ()=> { pop(200, .03, 0, .9, .1); pop(200, .022, .12, .9, .1); },
  squeak:()=> pop(900, .01, 0, 1.3, .09),
  bark:  ()=> { pop(330, .02, 0, .85, .12); pop(310, .016, .16, .85, .12); },
  meow:  ()=> pop(560, .012, 0, 1.25, .4),
  chirp: ()=> { [0,.09,.19].forEach((d,i)=> pop(1250+i*120, .007, d, 1.2, .07)); },
  song:  ()=> { [0,2,4,2,5,4,7].forEach((st,i)=> mallet(784*Math.pow(2,st/12), .006, i*.13, .22)); },
  flap:  ()=> { whoosh(.09, .01, 900); setTimeout(()=> whoosh(.09, .01, 900), 120); },
  bloop: ()=> pop(300, .022, 0, 2, .15),
};

/* ============================================================
   主循环
   ============================================================ */
let last = performance.now();
const tmp = new V3();
/* 藏着睡觉的动物：洞口飘个小小的 z，提示「这里有谁」 */
const zzz = (()=>{ const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.font = 'italic 700 46px Georgia,serif'; x.fillStyle = '#FFF6E6'; x.strokeStyle = 'rgba(60,40,20,.55)'; x.lineWidth = 5; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.strokeText('z', 32, 34); x.fillText('z', 32, 34); const t = new THREE.CanvasTexture(c);
  return beasts.filter(b=> b.sp.sleep && b.sp.sleep.mode === 'hide').map((b,i)=>{ const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, opacity:0, depthWrite:false }));
    s.userData = { b, p:i*.37 }; scene.add(s); return s; }); })();
const LD = { hemi:.26, sun:2.7, hc:new C3('#E3E9EE'), hg:new C3('#6E5E48'), sc:new C3('#FFF0DC'), table:new C3('#5E4F40') };
const LN = { hemi:.22, sun:.5, hc:new C3('#5F6F9E'), hg:new C3('#1C1A26'), sc:new C3('#9FB4FF'), table:new C3('#1E2330') };
function anchorOf(b){ if (b.hidden) return tmp.copy(b.den).setY(b.den.y + .55);
  return tmp.set(b.pos.x, b.pos.y + (b.sp.size||.5)*(b.world ? .25 : b.kind === 'dog' ? .9 : b.kind === 'rabbit' ? 1.15 : .95) + .1, b.pos.z); }
function loop(now){
  requestAnimationFrame(loop);
  const dt = clamp((now-last)/1000, 0, .05); last = now; const time = now/1000;
  night += (nightTarget - night)*Math.min(1, dt*1.4); const k = night;
  hemi.intensity = lerp(LD.hemi, LN.hemi, k); hemi.color.copy(LD.hc).lerp(LN.hc, k); hemi.groundColor.copy(LD.hg).lerp(LN.hg, k);
  sun.intensity = lerp(LD.sun, LN.sun, k); sun.color.copy(LD.sc).lerp(LN.sc, k);
  scene.background.copy(BG_DAY).lerp(BG_NIGHT, k); scene.fog.color.copy(scene.background);
  TABLE.material.color.copy(LD.table).lerp(LN.table, k);
  lamps.forEach(l=>{ l.L.intensity = k*2.4; l.glass.material.emissiveIntensity = k*2.6; });
  (DIO.yard.windows||[]).forEach(w=> w.material.emissiveIntensity = k*1.6);
  stars.material.opacity = k*.8; document.body.classList.toggle('dark', k > .5);
  finalPass.uniforms.night.value = k; finalPass.uniforms.time.value = time % 10;
  flies.forEach(f=>{ const u = f.userData;
    f.position.set(u.x + Math.sin(time*u.s + u.p)*.6, u.y + Math.sin(time*.7 + u.p)*.25, u.z + Math.cos(time*u.s*.8 + u.p)*.6);
    f.material.opacity = k*(.35 + .65*Math.max(0, Math.sin(time*2.2 + u.p*3))); });
  for (let i=foods.length-1;i>=0;i--){ const f = foods[i]; f.t += dt; const u = f.g.userData;
    if (u.fall > 0){ u.fall = Math.max(0, u.fall - dt*2); f.g.position.y = f.pos.y + u.fall; }
    else if (f.wet && f.t > 2){ const bot = f.d.ground(f.pos.x, f.pos.z) + .03; f.g.position.y = Math.max(bot, f.g.position.y - dt*.05); }
    if (f.type === 'bug') f.g.children.forEach((c,j)=>{ c.rotation.y += Math.sin(time*6+j)*dt*3; });
    if (f.t > 60 && !f.claimed) removeFood(f); }
  for (let i=ripples.length-1;i>=0;i--){ const r = ripples[i]; r.t += dt;
    r.m.scale.setScalar(1 + r.t*5*r.big); r.m.material.opacity = .55*(1 - r.t/1.2);
    if (r.t > 1.2){ scene.remove(r.m); ripples.splice(i,1); } }
  for (let i=puffs.length-1;i>=0;i--){ const p = puffs[i]; p.t += dt; p.m.position.addScaledVector(p.v, dt); p.v.multiplyScalar(1 - dt*2); p.v.y -= dt*.3;
    p.m.material.opacity = .8*(1 - p.t/p.life); if (p.t > p.life){ scene.remove(p.m); puffs.splice(i,1); } }
  updateCritters(dt, time); GRASS_U.value = time; DIO.pond.water.material.normalMap.offset.set(time*.012, time*.007); beasts.forEach(b=> live(b, dt, time));
  zzz.forEach(z=>{ const b = z.userData.b, on = b.hidden && b.state === 'sleep' && FOCUS === b.d.id;
    const u = z.userData; u.o = (u.o||0) + ((on ? 1 : 0) - (u.o||0))*Math.min(1, dt*3); z.visible = u.o > .02;
    const ph = (time*.45 + u.p) % 1; z.position.set(b.den.x + ph*.18, b.den.y + .45 + ph*.5, b.den.z); z.scale.setScalar(.22 + ph*.12);
    z.material.opacity = u.o*.9*Math.sin(ph*Math.PI); });
  if (camFly){ const fly = camFly; fly.k = Math.min(1, fly.k + dt/(fly.dur||1.3)); const e = sstep(0,1,fly.k);
    camera.position.lerpVectors(fly.p0, fly.g.pos, e); controls.target.lerpVectors(fly.t0, fly.g.tgt, e);
    if (fly.k >= 1) camFly = null; }
  controls.enabled = !camFly; controls.update();
  if (sel && follow && !camFly && !held && FOCUS){
    const g = closeGoal(sel), f = Math.min(1, dt*2.2); tmp.subVectors(g.tgt, controls.target).multiplyScalar(f);
    controls.target.add(tmp); camera.position.add(tmp);
  }
  for (let i=marks.length-1;i>=0;i--){ const m = marks[i]; m.t += dt; m.m.scale.setScalar(1 + m.t*2.5); m.m.material.opacity = .9*(1 - m.t/.9); if (m.t > .9){ scene.remove(m.m); marks.splice(i,1); } }
  if (sel) drawPortrait(dt);
  if (sel){
    const b = sel; if (FOCUS && b.d.id !== FOCUS) deselect();
    else {
      const a = b.say ? b.say.text : (b.hidden ? b.sp.sleep.act : b.act);
      if ($('cAct').textContent !== a) $('cAct').textContent = a;
      $('cAct').classList.toggle('say', !!b.say);
      const p = b.hidden ? b.den : b.pos, s = clamp((b.sp.size||.5)*1.2, .5, 1.6);
      ring.visible = true; ring.position.set(p.x, (b.sp.custom === 'axolotl' || b.sp.custom === 'betta') ? WATER_Y+.01 : p.y+.02, p.z);
      ring.scale.setScalar(s*(1 + Math.sin(time*4)*.04));
    }
  }
  if (foundT > 0){ foundT -= dt; if (foundT <= 0){ $('found').classList.remove('on'); setTimeout(showFound, 400); } }
  else if (foundQ.length && !$('found').classList.contains('on')) showFound();
  if (hintTemp > 0){ hintTemp -= dt; if (hintTemp <= 0) updateHint(); }
  const tag = $('tag');
  if (hover && hover !== sel){ anchorOf(hover).project(camera);
    tag.style.transform = `translate(${(tmp.x*.5+.5)*innerWidth}px, ${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%, -100%)`;
    tag.textContent = hover.hidden ? '里面好像有谁' : hover.sp.name; tag.classList.add('on'); }
  else if (hoverDio){ tmp.set(hoverDio.cx, 1.6, hoverDio.cz).project(camera);
    const S = SCENES.find(s=>s.id === hoverDio.id);
    tag.style.transform = `translate(${(tmp.x*.5+.5)*innerWidth}px, ${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%, -100%)`;
    tag.textContent = `${S.name} · ${S.kinds.length} 种动物`; tag.classList.add('on'); }
  else tag.classList.remove('on');
  composer.render();
}
/* 窗口大小变了：画面尺寸、镜头距离一起跟着变（没选中动物时重新取景） */
window.fitViewSafe = ()=>{ camera.fov = camera.aspect < .9 ? 40 : 30; camera.updateProjectionMatrix(); if (!sel && !held) flyTo(FOCUS, true); };
onResize();
$('enter').onclick = ()=>{ $('intro').classList.add('gone'); sfx.page(); };
$('enter').disabled = false; $('enter').textContent = '开始';
window.APP_READY = 1; Object.assign(window, { flyTo, select, deselect, poke, feed, BY, beasts, live, seen, SIM:window.SIM });
drawNav(); camera.aspect = innerWidth/innerHeight; fitView();
requestAnimationFrame(loop);

})();
</script>
